<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kenny Tracker">
<title>Kenny Training Tracker</title>
<style>
:root{
  --ink:#FFFFFF; --ink2:#E4E4E6; --mid:#8E8E93; --soft:#636366;
  --line:rgba(255,255,255,0.08); --bg:#09090B; --card:rgba(255,255,255,0.05); --acc:#FF521B; --tint:rgba(255,82,27,0.14);
  --radius:18px; --ease:cubic-bezier(0.16,1,0.3,1);
}
[data-theme="dark"]{
  --ink:#FFFFFF; --ink2:#E4E4E6; --mid:#8E8E93; --soft:#636366;
  --line:rgba(255,255,255,0.08); --bg:#09090B; --card:rgba(255,255,255,0.05); --acc:#FF521B; --tint:rgba(255,82,27,0.14);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;}
html,body{margin:0;padding:0;}
html{ background:var(--bg); overscroll-behavior-y:none; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans CJK TC",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;
  font-variant-numeric:tabular-nums;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  min-height:100vh; overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
}
input,textarea{ -webkit-user-select:text; user-select:text; }
.wrap{max-width:480px; margin:0 auto; padding:20px 18px 10px; animation:fadeInUp .5s var(--ease) both;}
h1{font-size:22px; font-weight:800; margin:0 0 3px; letter-spacing:-.3px;}
h2{font-size:17px; font-weight:800; margin:0 0 10px;}
h3{font-size:13px; font-weight:700; color:var(--mid); margin:22px 0 10px; letter-spacing:.4px;}
p{margin:4px 0;}
.muted{color:var(--mid); font-size:13px;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; margin-bottom:14px;
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  animation:cardSettle .18s ease-out both;
  transition:transform .15s ease, background .2s ease;
}
@supports not (backdrop-filter: blur(1px)){
  .card{ background:#1C1C1E; }
  [data-theme="light"] .card{ background:#F2F2F7; }
  .navbar{ background:#121215; }
  .toast{ background:#1C1C1E; }
}
.card.warn{background:rgba(255,159,10,0.12); border-color:rgba(255,159,10,0.35); color:#FFD8A8;}
[data-theme="light"] .card.warn{background:rgba(255,159,10,0.14); border-color:#FF9F0A; color:#8A3E1E;}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.pill{display:inline-block; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.4px;}
.pill-acc{background:var(--tint); color:var(--acc);}
.pill-mid{background:rgba(255,255,255,0.06); color:var(--mid); border:1px solid var(--line);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:1px solid var(--line); background:rgba(255,255,255,0.06); color:var(--ink);
  border-radius:14px; padding:14px 18px; font-size:16px; font-weight:700;
  cursor:pointer; width:100%; -webkit-appearance:none; appearance:none;
  min-height:44px; transition:transform .15s ease, background .2s ease;
}
.btn:active{transform:scale(0.975); background:rgba(255,255,255,0.1);}
.btn-primary{background:var(--acc); color:#0A0A0A; border-color:var(--acc); box-shadow:0 8px 24px -8px rgba(255,82,27,0.6);}
.btn-primary:active{transform:scale(0.988);}
.btn-ghost{background:transparent;}
.btn-sm{padding:10px 16px; font-size:13px; width:auto; min-height:40px;}
.btn-danger{color:#FF6961; border-color:rgba(255,105,97,0.4);}
input[type=number],input[type=text],textarea{
  width:100%; border:1px solid var(--line); background:rgba(255,255,255,0.04); color:var(--ink);
  border-radius:12px; padding:12px 14px; font-size:16px; font-family:inherit;
  transition:border-color .2s ease, background .2s ease;
}
input:focus,textarea:focus{ outline:none; border-color:var(--acc); background:rgba(255,255,255,0.07); }
textarea{resize:vertical; min-height:76px;}
.stepper{display:flex; align-items:center; gap:3px;}
.stepper input{text-align:center; font-weight:800; font-size:14px; padding:10px 2px; min-width:0;}
.stepbtn{
  width:28px; height:36px; border-radius:9px; border:1px solid var(--line);
  background:rgba(255,255,255,0.06); font-size:15px; font-weight:800; color:var(--ink);
  flex-shrink:0; cursor:pointer; padding:0; transition:transform .15s ease, background .2s ease;
}
.stepbtn:active{transform:scale(0.97); background:rgba(255,255,255,0.14);}
.exname{font-weight:800; font-size:16px; letter-spacing:-.2px;}
.exmeta{font-size:12px; color:var(--soft); letter-spacing:.3px; margin-top:2px;}
.setrow{
  display:grid; grid-template-columns:22px 1fr 1fr 46px 44px; gap:5px; align-items:center;
  padding:10px 0; border-top:1px solid var(--line); transition:opacity .3s ease;
}
.setrow:first-of-type{border-top:none;}
.setrow.active{background:var(--tint); margin:0 -12px; padding:10px 12px; border-radius:14px; border-top:none;}
.setrow.donerow{opacity:.42;}
.setnum{font-weight:800; color:var(--mid); font-size:13px; text-align:center;}
.setlabel{font-size:9px; color:var(--soft); text-align:center; letter-spacing:.6px; margin-bottom:3px;}
.rirbox input{text-align:center; font-weight:800; font-size:14px; padding:10px 2px; width:100%;}
.check{
  width:44px; height:44px; border-radius:12px; border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer;
  background:rgba(255,255,255,0.05); color:var(--soft); flex-shrink:0;
  transition:transform .15s ease, background .2s ease, border-color .2s ease;
}
.check:active{transform:scale(0.97);}
.check.done{background:var(--acc); border-color:var(--acc); color:#0A0A0A; box-shadow:0 4px 16px -4px rgba(255,82,27,0.7);}
.progress-bar{height:6px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; margin:10px 0;}
.progress-fill{height:100%; background:var(--acc); border-radius:3px; transition:width .5s var(--ease);}
.navbar.dim{opacity:.4;}
.toast{
  position:fixed; bottom:calc(80px + env(safe-area-inset-bottom)); left:50%;
  transform:translateX(-50%) translateY(10px);
  background:rgba(28,28,30,0.9); color:#fff; padding:10px 18px; border-radius:24px;
  font-size:13px; font-weight:700; z-index:80; opacity:0; transition:opacity .25s ease, transform .25s var(--ease);
  pointer-events:none; white-space:nowrap; backdrop-filter:blur(20px); border:1px solid var(--line);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.lasttime{font-size:15px; font-weight:800; margin:3px 0; font-variant-numeric:tabular-nums;}
.exlistrow{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); transition:opacity .3s ease, transform .15s ease;}
.exlistrow:first-child{border-top:none;}
.exlistrow:active{transform:scale(0.98);}
.exlistrow.done{opacity:.4;}
.exlistrow.current{background:var(--tint); margin:0 -12px; padding:12px; border-radius:14px; border-top:none;}
.exdot{width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; transition:background .2s ease, border-color .2s ease;}
.exdot.done{background:var(--acc); border-color:var(--acc); color:#0A0A0A;}
.exdot.current{border-color:var(--acc); color:var(--acc);}
.navbar{
  position:fixed; bottom:0; left:0; right:0;
  background:rgba(18,18,21,0.85); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--line); display:flex; z-index:50;
  padding-bottom:env(safe-area-inset-bottom); transition:opacity .3s ease;
}
.navitem{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:11px 0 9px; cursor:pointer; color:var(--soft); font-size:10px; font-weight:700;
  letter-spacing:.4px; min-height:44px; transition:color .2s ease, transform .15s ease;
}
.navitem:active{transform:scale(0.96);}
.navitem.active{color:var(--acc);}
.navicon{width:20px; height:20px; display:block; margin:0 auto;}
.timer-overlay{
  position:fixed; inset:0; background:rgba(9,9,11,0.96); backdrop-filter:blur(30px); z-index:100;
  display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff;
  animation:fadeInUp .3s var(--ease) both;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
}
.timer-num{font-size:68px; font-weight:800; letter-spacing:-1.5px; font-variant-numeric:tabular-nums; color:var(--acc); text-shadow:0 0 40px rgba(255,82,27,0.5);}
.timer-label{font-size:13px; color:var(--mid); letter-spacing:3px; text-transform:uppercase; margin-bottom:10px;}
.timer-controls{display:flex; gap:10px; margin-top:28px;}
.timer-btn{
  padding:12px 20px; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,0.06);
  color:#fff; font-size:14px; font-weight:700; cursor:pointer; min-height:44px;
  transition:transform .15s ease, background .2s ease;
}
.timer-btn:active{transform:scale(0.97); background:rgba(255,255,255,0.14);}
.screen{display:none;}
.screen.active{display:block;}
.divider{height:1px; background:var(--line); margin:14px 0;}
.empty{text-align:center; padding:36px 12px; color:var(--soft); font-size:13px;}
.histitem{padding:12px 0; border-top:1px solid var(--line);}
.histitem:first-child{border-top:none;}
table.mini{width:100%; border-collapse:collapse; font-size:13px;}
table.mini th{text-align:left; color:var(--soft); font-size:10px; font-weight:700; letter-spacing:.5px; padding:5px 6px; border-bottom:1px solid var(--line);}
table.mini td{padding:7px 6px; border-bottom:1px solid var(--line);}
.toggle{position:relative; width:46px; height:28px; border-radius:15px; background:rgba(255,255,255,0.12); cursor:pointer; flex-shrink:0; transition:background .25s ease;}
.toggle.on{background:var(--acc);}
.toggle::after{content:''; position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:#fff; transition:left .25s var(--ease); box-shadow:0 2px 6px rgba(0,0,0,0.3);}
.toggle.on::after{left:20px;}
.topbar{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
.back{font-size:22px; color:var(--mid); cursor:pointer; padding:4px 6px; min-width:44px; min-height:44px; display:flex; align-items:center; transition:opacity .15s ease;}
.back:active{opacity:.5;}

@keyframes fadeInUp{
  from{ opacity:0; transform:translateY(14px); }
  to{ opacity:1; transform:translateY(0); }
}
@keyframes cardSettle{
  from{ opacity:0; transform:translateY(3px); }
  to{ opacity:1; transform:translateY(0); }
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:0.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.001ms !important;
    scroll-behavior:auto !important;
  }
}
:focus-visible{ outline:2px solid var(--acc); outline-offset:2px; }
:focus:not(:focus-visible){ outline:none; }
</style>
</head>

<div class="navbar">
  <div class="navitem" data-nav="home" role="button" aria-label="首頁"><svg class="navicon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>HOME</div>

<script>
function g(n,sets,reps,rir,rest,weighted,type,extra){ return Object.assign({n,sets,reps,rir,rest,weighted,type},extra||{}); }
const HOME_DIFF = "難度不夠時依序：加次數→放慢節奏→加停頓→加大動作範圍→改單邊→縮短休息";

const PROGRAM_GYM = {
  1: {name:"Day 1 — 下半身A", exercises:[
    g("Pogo Jump",3,"10","—",60,false,"reps",{muscle:"跳躍"}),
    g("2步助跑跳",5,"3","—",90,false,"reps",{muscle:"跳躍"}),
    g("Back Squat",4,"5",2,210,true,"reps",{muscle:"股四頭",main:true,inc:5}),
    g("Bulgarian Split Squat",3,"10/邊",2,120,true,"reps",{muscle:"股四頭"}),
    g("RDL",3,"8",2,120,true,"reps",{muscle:"腿後"}),
    g("Standing Calf Raise",4,"10",1,90,true,"reps",{muscle:"小腿"}),
    g("Spanish Squat",3,"30秒","—",60,false,"time",{muscle:"膝關節"})
  ]},
  2: {name:"Day 2 — 上半身A", exercises:[
    g("Bench Press",4,"5",2,180,true,"reps",{muscle:"胸",main:true,inc:2.5}),
    g("Pull-up",4,"6","1–2",150,true,"reps",{muscle:"背",main:true,inc:2.5}),
    g("Incline DB Press",3,"10",1,120,true,"reps",{muscle:"胸"}),
    g("Chest-Supported Row",3,"12",1,120,true,"reps",{muscle:"背"}),
    g("Seated DB Press",3,"10","1–2",120,true,"reps",{muscle:"其他"}),
    g("Lateral Raise",3,"15","0–1",90,true,"reps",{muscle:"肩中"}),
    g("Overhead Extension",3,"12",1,90,true,"reps",{muscle:"三頭"})
  ]},
  3: {name:"Day 3 — 下半身B", exercises:[
    g("CMJ",5,"3","—",120,false,"reps",{muscle:"跳躍"}),
    g("Lateral Bound",3,"4/邊","—",120,false,"reps",{muscle:"跳躍"}),
    g("Trap-bar Deadlift",4,"5",2,180,true,"reps",{muscle:"後鏈",main:true,inc:5}),
    g("Hip Thrust",3,"10","1–2",120,true,"reps",{muscle:"臀"}),
    g("Leg Press",3,"12",1,120,true,"reps",{muscle:"股四頭"}),
    g("Leg Curl",3,"10",1,90,true,"reps",{muscle:"腿後"}),
    g("Seated Calf Raise",3,"12",1,90,true,"reps",{muscle:"小腿"})
  ]},
  4: {name:"Day 4 — 上半身B", exercises:[
    g("Pull-up Cluster",5,"3",2,120,true,"reps",{muscle:"背"}),
    g("Standing OHP",4,"6",2,150,true,"reps",{muscle:"肩前",main:true,inc:2.5}),
    g("Cable Row",3,"12",1,120,true,"reps",{muscle:"背"}),
    g("Lat Pulldown",3,"15","0–1",90,true,"reps",{muscle:"背"}),
    g("Face Pull",3,"15","0–1",60,true,"reps",{muscle:"肩後"}),
    g("Lateral Raise",3,"15","0–1",60,true,"reps",{muscle:"肩中"}),
    g("Incline DB Curl",3,"10",1,90,true,"reps",{muscle:"二頭"}),
    g("Pallof Press",2,"8–10/邊",1,60,true,"reps",{muscle:"核心"})
  ]},
  5: {name:"Day 5 — 選配", exercises:[
    g("Lateral Raise",3,"18","0–1",60,true,"reps",{muscle:"肩中"}),
    g("Face Pull",3,"18","0–1",60,true,"reps",{muscle:"肩後"}),
    g("Fly",3,"15","0–1",60,true,"reps",{muscle:"胸"}),
    g("Hammer Curl",3,"12","0–1",60,true,"reps",{muscle:"二頭"}),
    g("Rope Pushdown",3,"15","0–1",60,true,"reps",{muscle:"三頭"})
  ]}
};

const PROGRAM_HOME = {
  1: {name:"Day 1 — 下半身A（居家）", exercises:[
    g("Pogo Jump",3,"10","—",60,false,"reps",{muscle:"跳躍"}),
    g("2步助跑跳",5,"3","—",90,false,"reps",{muscle:"跳躍"}),
    g("Bulgarian Split Squat",4,"12/邊",2,120,true,"reps",{muscle:"股四頭",main:true,home:true,diffNote:HOME_DIFF}),
    g("Goblet Squat",3,"15–20",1,120,true,"reps",{muscle:"股四頭",home:true,diffNote:HOME_DIFF}),
    g("Single-leg RDL",3,"10/邊",2,120,true,"reps",{muscle:"腿後",home:true,diffNote:HOME_DIFF}),
    g("Single-leg Calf Raise",4,"15–20/邊",1,90,true,"reps",{muscle:"小腿",home:true,diffNote:HOME_DIFF}),
    g("Spanish Squat（靠牆蹲）",3,"30秒","—",60,false,"time",{muscle:"膝關節"})
  ]},
  2: {name:"Day 2 — 上半身A（居家）", exercises:[
    g("DB Floor Press",4,"10–12",1,150,true,"reps",{muscle:"胸",main:true,home:true,diffNote:HOME_DIFF}),
    g("Inverted Row",3,"15","近力竭",150,false,"reps",{muscle:"背",home:true,diffNote:HOME_DIFF}),
    g("Feet-elevated Push-up",3,"近力竭前1下",1,120,false,"reps",{muscle:"胸",home:true,diffNote:HOME_DIFF}),
    g("One-arm DB Row",3,"12/邊",1,120,true,"reps",{muscle:"背",home:true,diffNote:HOME_DIFF}),
    g("DB Shoulder Press",3,"10–12","1–2",120,true,"reps",{muscle:"肩前",home:true,diffNote:HOME_DIFF}),
    g("Lateral Raise",3,"15–20","0–1",90,true,"reps",{muscle:"肩中",home:true,diffNote:HOME_DIFF}),
    g("Bench Dip",3,"15",1,90,false,"reps",{muscle:"三頭",home:true,diffNote:HOME_DIFF})
  ]},
  3: {name:"Day 3 — 下半身B（居家）", exercises:[
    g("跳上椅子／樓梯落下跳",5,"3","—",120,false,"reps",{muscle:"跳躍"}),
    g("Lateral Bound",3,"4/邊","—",120,false,"reps",{muscle:"跳躍"}),
    g("DB Deadlift",4,"12–15",1,150,true,"reps",{muscle:"後鏈",main:true,home:true,diffNote:HOME_DIFF}),
    g("Single-leg Hip Thrust",3,"15/邊","1–2",120,true,"reps",{muscle:"臀",home:true,diffNote:HOME_DIFF}),
    g("Reverse Lunge",3,"12/邊",1,120,true,"reps",{muscle:"股四頭",home:true,diffNote:HOME_DIFF}),
    g("Sliding Leg Curl",3,"10–12",1,90,false,"reps",{muscle:"腿後",home:true,diffNote:HOME_DIFF}),
    g("Seated Calf Raise（腿壓啞鈴）",3,"20",1,90,true,"reps",{muscle:"小腿",home:true,diffNote:HOME_DIFF})
  ]},
  4: {name:"Day 4 — 上半身B（居家）", exercises:[
    g("Pull-up 或 Inverted Row",5,"3或12",2,120,false,"reps",{muscle:"背"}),
    g("DB Shoulder Press",4,"8",2,150,true,"reps",{muscle:"肩前",main:true,home:true,diffNote:HOME_DIFF}),
    g("Bent-over DB Row",3,"12",1,120,true,"reps",{muscle:"背",home:true,diffNote:HOME_DIFF}),
    g("Inverted Row",3,"15","0–1",90,false,"reps",{muscle:"背",home:true,diffNote:HOME_DIFF}),
    g("Reverse Fly",3,"18","0–1",60,true,"reps",{muscle:"胸",home:true,diffNote:HOME_DIFF}),
    g("Lateral Raise",3,"15–20","0–1",60,true,"reps",{muscle:"肩中",home:true,diffNote:HOME_DIFF}),
    g("DB Curl",3,"12",1,90,true,"reps",{muscle:"二頭",home:true,diffNote:HOME_DIFF})
  ]},
  5: PROGRAM_GYM[5]
};

let PROGRAM = PROGRAM_GYM;
const GYM_MAIN = ["Back Squat","Bench Press","Trap-bar Deadlift","Standing OHP","Pull-up"];
const HOME_MAIN = ["Bulgarian Split Squat","DB Floor Press","DB Deadlift","DB Shoulder Press"];

let DB = {sessions:[], notes:[], bodyweight:[], settings:{theme:"light", mode:"gym"}};

// 若不是在 Claude 對話框裡開啟（例如加到 iPhone 主畫面獨立執行），
// window.storage 不存在，改用瀏覽器內建的 localStorage 當備援，行為對 App 其餘部分完全透明。
if(!window.storage){
  window.storage = {
    get: async(k)=>{ const v = localStorage.getItem(k); return v===null ? null : {value:v}; },
    set: async(k,v)=>{ localStorage.setItem(k,v); return {value:v}; }
  };
}
let state = {screen:"home", currentDay:null, currentSession:null, exIndex:0, timerEndAt:0, timerPausedLeft:null, timerInterval:null};

async function loadDB(){
  try{ const r = await window.storage.get('kenny-db'); if(r && r.value) DB = JSON.parse(r.value); }catch(e){}
  if(!DB.settings.mode) DB.settings.mode = 'gym';
  applyTheme(); applyMode();
}
async function saveDB(){
  try{ await window.storage.set('kenny-db', JSON.stringify(DB)); }catch(e){}
}
function applyTheme(){ document.body.setAttribute('data-theme', DB.settings.theme||'light'); }
function applyMode(){ PROGRAM = DB.settings.mode==='home' ? PROGRAM_HOME : PROGRAM_GYM; }

function progFor(mode){ return mode==='home' ? PROGRAM_HOME : PROGRAM_GYM; }
function safeDay(mode,day){ const p=progFor(mode); return p[day] || PROGRAM_GYM[day]; }
function fmtDate(d){ const dt=new Date(d); return (dt.getMonth()+1)+"/"+dt.getDate(); }
function escapeHtml(str){
  if(str===null || str===undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function localISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return localISO(new Date()); }
function weekdayStr(){ return ["週日","週一","週二","週三","週四","週五","週六"][new Date().getDay()]; }

function nextSuggestedDay(){
  const mainDays = DB.sessions.filter(s=>s.day>=1 && s.day<=4);
  if(mainDays.length===0) return 1;
  const last = mainDays[mainDays.length-1].day;
  return last>=4 ? 1 : last+1;
}

function lastPerformance(exName, excludeSessionId){
  for(let i=DB.sessions.length-1;i>=0;i--){
    const s = DB.sessions[i];
    if(excludeSessionId && s.id===excludeSessionId) continue;
    const ex = s.exercises.find(e=>e.def.n===exName);
    if(ex && ex.sets.some(st=>st.done)) return {date:s.date, sets:ex.sets.filter(st=>st.done)};
  }
  return null;
}

function topOfRange(repsStr){
  const nums = String(repsStr).match(/\d+(\.\d+)?/g);
  if(!nums) return null;
  return Math.max(...nums.map(Number));
}
function bottomOfRange(repsStr){
  const nums = String(repsStr).match(/\d+(\.\d+)?/g);
  if(!nums) return null;
  return Math.min(...nums.map(Number));
}
function recentPerformances(exName, n){
  const out = [];
  for(let i=DB.sessions.length-1;i>=0 && out.length<n;i--){
    const s = DB.sessions[i];
    const ex = s.exercises.find(e=>e.def.n===exName);
    if(ex){
      const done = ex.sets.filter(x=>x.done);
      if(done.length>0) out.push({date:s.date, sets:done});
    }
  }
  return out;
}
function bestSetOf(perf){
  return perf.sets.reduce((a,s)=>{
    const w = s.weight||0;
    if(!a) return {weight:w, reps:s.reps};
    if(w>a.weight || (w===a.weight && s.reps>a.reps)) return {weight:w, reps:s.reps};
    return a;
  }, null);
}
function suggestNextLoad(exDef){
  const last = lastPerformance(exDef.n);
  if(!last || !exDef.main) return null;
  const topReps = topOfRange(exDef.reps);
  const botReps = bottomOfRange(exDef.reps);
  const allHitTop = last.sets.length>=exDef.sets && last.sets.every(s=>s.reps>=topReps);

  if(allHitTop){
    if(exDef.home) return {tier:1, suggest:true, mode:'home', reason:"上次全數達標次數上限 → 該換下一個難度技巧了", note:exDef.diffNote};
    const w = Math.max(...last.sets.map(s=>s.weight||0));
    return {tier:1, suggest:true, mode:'gym', newWeight:(w+exDef.inc), reason:"上次全數達標次數上限 → 建議加重"};
  }

  // Tier 3：連續兩次都沒進步 → 疑似停滯，優先於單純的「維持」提示
  const recent = recentPerformances(exDef.n, 2);
  if(recent.length===2){
    const b0 = bestSetOf(recent[0]);
    const b1 = bestSetOf(recent[1]);
    const improved = b0.weight>b1.weight || (b0.weight===b1.weight && b0.reps>b1.reps);
    if(!improved){
      return exDef.home
        ? {tier:3, suggest:true, mode:'home-stall', reason:"連續兩次沒有進步", note:"先檢查睡眠與疲勞狀況，難度可能維持太久或恢復不足，不是立刻換更難的技巧"}
        : {tier:3, suggest:true, mode:'gym-stall', reason:"連續兩次沒有進步", note:"依序檢查：睡眠／動作品質／是否需要 Deload（見課表停滯處理SOP），不要先假設是訓練量不夠"};
    }
  }

  // Tier 2：在次數範圍內，只是還沒打滿上限 → 維持
  if(last.sets.length>0 && botReps!==null && last.sets.every(s=>s.reps>=botReps)){
    return {tier:2, suggest:true, mode:'maintain', reason:"次數在範圍內，還沒打滿上限", note:"維持這個重量，下次專注打滿次數再談加重"};
  }

  return {tier:0, suggest:false};
}

function render(){
  const app = document.getElementById('app');
  document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active', n.dataset.nav===state.screen));
  const navbar = document.querySelector('.navbar');
  if(navbar) navbar.classList.toggle('dim', state.screen==='exercise');
  if(state.screen==='home') app.innerHTML = renderHome();
  else if(state.screen==='workout') app.innerHTML = renderWorkoutPicker();
  else if(state.screen==='today') app.innerHTML = renderToday();
  else if(state.screen==='exercise') app.innerHTML = renderExercise();
  else if(state.screen==='complete') app.innerHTML = renderComplete();
  else if(state.screen==='history') app.innerHTML = renderHistory();
  else if(state.screen==='sessionDetail') app.innerHTML = renderSessionDetail();
  else if(state.screen==='progress') app.innerHTML = renderProgress();
  else if(state.screen==='insights') app.innerHTML = renderInsights();
  else if(state.screen==='more') app.innerHTML = renderMore();
  bindEvents();
}

function smartDefault(ex, si, field){
  // carry forward from an earlier completed set in THIS session first
  for(let j=si-1;j>=0;j--){ if(ex.sets[j].done && ex.sets[j][field]!==null) return ex.sets[j][field]; }
  return null;
}

function renderSuggestionCard(s){
  if(s.mode==='gym') return `<div class="card" style="background:var(--tint); border-color:var(--acc)"><p style="color:var(--acc); font-weight:700; font-size:13px; margin:0">${s.reason} → 建議 ${s.newWeight}kg</p></div>`;
  if(s.mode==='home') return `<div class="card" style="background:var(--tint); border-color:var(--acc)"><p style="color:var(--acc); font-weight:700; font-size:13px; margin:0 0 4px">${s.reason}</p><p style="font-size:12px; color:var(--ink2); margin:0">${s.note}</p></div>`;
  if(s.mode==='maintain') return `<div class="card"><p style="font-weight:700; font-size:13px; margin:0 0 4px">${s.reason}</p><p style="font-size:12px; color:var(--mid); margin:0">${s.note}</p></div>`;
  if(s.mode==='gym-stall' || s.mode==='home-stall') return `<div class="card warn"><p style="font-weight:800; font-size:13px; margin:0 0 4px">⚠ ${s.reason}</p><p style="font-size:12px; margin:0">${s.note}</p></div>`;
  return '';
}
function renderExercise(){
  const sess = state.currentSession;
  const ex = sess.exercises[state.exIndex];
  const def = ex.def;
  const last = lastPerformance(def.n, sess.id);
  const suggestion = suggestNextLoad(def);
  const firstUndone = ex.sets.findIndex(s=>!s.done);
  return `
    <div class="topbar"><span class="back" data-action="backToday">‹</span><h1>${def.n}</h1></div>
    <p class="exmeta">${def.sets} × ${def.reps} · Target RIR ${def.rir} · Rest ${def.rest>=60?(def.rest/60)+'min':def.rest+'s'}</p>
    ${last ? `
    <div class="card" style="border-color:var(--acc)">
      <p style="font-size:10px; letter-spacing:.5px; color:var(--acc); font-weight:800; margin-bottom:6px">LAST TIME · ${fmtDate(last.date)}</p>
      ${last.sets.map(s=>`<p class="lasttime">${def.weighted?(s.weight+'kg × '):''}${s.reps}${def.type==='time'?'秒':'下'}${def.weighted?` <span class="muted" style="font-size:12px; font-weight:400">RIR ${s.rir}</span>`:''}</p>`).join('')}
    </div>` : `<p class="muted" style="font-size:12px">No previous performance.</p>`}
    ${suggestion && suggestion.suggest ? renderSuggestionCard(suggestion) : ''}
    <div style="height:8px"></div>
    <div class="card">
      ${ex.sets.map((s,si)=>{
        const isActive = si===firstUndone;
        const wDefault = s.weight!==null ? s.weight : (smartDefault(ex,si,'weight') ?? (last && last.sets[si] ? last.sets[si].weight : (last && last.sets[0] ? last.sets[0].weight : '')));
        const rDefault = s.reps!==null ? s.reps : (smartDefault(ex,si,'reps') ?? (last && last.sets[si] ? last.sets[si].reps : (last && last.sets[0] ? last.sets[0].reps : '')));
        return `
        <div class="setrow ${isActive?'active':''} ${s.done?'donerow':''}">
          <div class="setnum">${si+1}</div>
          ${def.weighted ? `
          <div><div class="setlabel">KG</div>
            <div class="stepper">
              <button class="stepbtn" data-action="step" data-si="${si}" data-field="weight" data-delta="-2.5" type="button">−</button>
              <input type="number" inputmode="decimal" value="${wDefault}" data-setfield="weight" data-si="${si}" placeholder="0" ${s.done?'disabled':''}>
              <button class="stepbtn" data-action="step" data-si="${si}" data-field="weight" data-delta="2.5" type="button">+</button>
            </div>
          </div>` : `<div></div>`}
          <div><div class="setlabel">${def.type==='time'?'SEC':'REPS'}</div>
            <div class="stepper">
              <button class="stepbtn" data-action="step" data-si="${si}" data-field="reps" data-delta="-1" type="button">−</button>
              <input type="number" inputmode="numeric" value="${rDefault}" data-setfield="reps" data-si="${si}" placeholder="0" ${s.done?'disabled':''}>
              <button class="stepbtn" data-action="step" data-si="${si}" data-field="reps" data-delta="1" type="button">+</button>
            </div>
          </div>
          ${def.type!=='time' ? `
          <div class="rirbox"><div class="setlabel">RIR</div>
            <input type="number" inputmode="numeric" value="${s.rir!==null&&s.rir!==undefined&&s.rir!==''?s.rir:''}" data-setfield="rir" data-si="${si}" placeholder="-" ${s.done?'disabled':''}>
          </div>` : `<div></div>`}
          <div class="check ${s.done?'done':''}" data-action="toggleSet" data-si="${si}">${s.done?'✓':''}</div>
        </div>
      `;}).join('')}
    </div>
    <button class="btn btn-ghost" data-action="prevOrNextExercise" data-dir="-1" ${state.exIndex===0?'style="visibility:hidden"':''}>‹ 上一個動作</button>

  `;
}

function renderComplete(){
  const sess = state.currentSession;
  const totalSets = sess.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
  const rirVals = sess.exercises.flatMap(e=>e.sets.filter(s=>s.done && s.rir!==null && s.rir!=='').map(s=>Number(s.rir)));
  const avgRir = rirVals.length ? (rirVals.reduce((a,b)=>a+b,0)/rirVals.length).toFixed(1) : '—';
  const volume = sess.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done&&e.def.weighted).reduce((b,s)=>b+(s.weight||0)*(s.reps||0),0),0);
  const newPRs = [];
  sess.exercises.forEach(e=>{
    if(!e.def.weighted) return;
    const doneSets = e.sets.filter(s=>s.done && s.weight!==null);
    if(doneSets.length===0) return;
    const priorSets = DB.sessions.flatMap(s=>{
      const ex = s.exercises.find(x=>x.def.n===e.def.n);
      return ex ? ex.sets.filter(x=>x.done && x.weight!==null) : [];
    });
    if(priorSets.length===0) return;
    const priorMax = Math.max(...priorSets.map(x=>x.weight));
    const thisMax = Math.max(...doneSets.map(x=>x.weight));
    if(thisMax > priorMax) newPRs.push({name:e.def.n, weight:thisMax, prior:priorMax});
  });
  return `
    <div style="text-align:center; padding:20px 0 10px">
      <div style="font-size:40px">✓</div>
      <h1>WORKOUT COMPLETE</h1>
      <p class="muted">${progFor(sess.mode)[sess.day].name}</p>
    </div>
    ${newPRs.length ? `
    <div class="card" style="background:var(--tint); border-color:var(--acc)">
      <p style="font-size:10px; letter-spacing:.5px; color:var(--acc); font-weight:800; margin-bottom:6px">NEW PERSONAL RECORD</p>
      ${newPRs.map(p=>`<p style="margin:3px 0; font-weight:800; font-size:14px">${p.name} — ${p.weight}kg <span class="muted" style="font-weight:400; font-size:12px">(前次 ${p.prior}kg)</span></p>`).join('')}
    </div>` : ''}
    <div class="card">
      <div class="row" style="padding:6px 0"><span class="muted">Exercises</span><span style="font-weight:800">${sess.exercises.length}</span></div>
      <div class="divider"></div>
      <div class="row" style="padding:6px 0"><span class="muted">Sets Completed</span><span style="font-weight:800">${totalSets}</span></div>
      <div class="divider"></div>
      <div class="row" style="padding:6px 0"><span class="muted">Total Volume</span><span style="font-weight:800">${volume>0?Math.round(volume)+' kg':'—'}</span></div>
      <div class="divider"></div>
      <div class="row" style="padding:6px 0"><span class="muted">Average RIR</span><span style="font-weight:800">${avgRir}</span></div>
    </div>
    <h3>NOTES（選填）</h3>
    <div class="card">
      <textarea id="sessionNote" placeholder="睡眠、精神、疼痛、技術問題...">${escapeHtml(sess.note||'')}</textarea>
    </div>
    <button class="btn btn-primary" data-action="saveAndFinish">儲存並回首頁</button>
  `;
}

function dateLabel(d){
  const today = todayISO();
  const yest = localISO(new Date(Date.now()-86400000));
  if(d===today) return '今天';
  if(d===yest) return '昨天';
  return fmtDate(d);
}

function renderHistory(){
  if(DB.sessions.length===0) return `<h1>HISTORY</h1><div class="empty">No data yet.</div>`;
  const rev = [...DB.sessions].reverse();
  let lastLabel = null;
  let html = '';
  rev.forEach(s=>{
    const label = dateLabel(s.date);
    if(label!==lastLabel){ html += `<h3>${label.toUpperCase()}</h3>`; lastLabel = label; }
    const sets = s.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);
    html += `
      <div class="card" data-action="viewSession" data-id="${s.id}" style="cursor:pointer; margin-bottom:8px">
        <div class="row">
          <div>
            <div class="exname">${progFor(s.mode)[s.day].name}${s.backfill?' <span class="pill pill-mid" style="font-size:9px">補登</span>':''}</div>
            <div class="muted">${s.mode==='home'?'居家':'健身房'}</div>
          </div>
          <span class="muted">${sets} sets</span>
        </div>
      </div>`;
  });
  return `<h1>HISTORY</h1>${html}`;
}

function renderSessionDetail(){

function estOneRM(w,r){ if(!w||!r) return 0; return Math.round(w*(1+r/30)); }

function sparkline(points){
  if(points.length<2) return '';
  const w=300, h=44;
  const vals = points.map(p=>p);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const stepX = w/(points.length-1);
  const coords = points.map((v,i)=>{
    const x = i*stepX;
    const y = h - ((v-min)/range)*(h-6) - 3;
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block; margin:8px 0 4px">
    <polyline points="${coords}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function exerciseProgressCard(name){
  const bySession = DB.sessions.map(s=>{
    const ex = s.exercises.find(e=>e.def.n===name);
    if(!ex) return null;
    const done = ex.sets.filter(x=>x.done && x.weight!==null);
    if(done.length===0) return null;
    return { date:s.date, top1rm: Math.max(...done.map(x=>estOneRM(x.weight,x.reps))), sets:done };
  }).filter(Boolean);
  if(bySession.length===0){
    return `<div class="card"><div class="exname">${name}</div><p class="muted" style="font-size:12px">No data yet.</p></div>`;
  }
  const allSets = bySession.flatMap(b=>b.sets.map(s=>({...s,date:b.date})));
  const heaviest = Math.max(...allSets.map(x=>x.weight||0));
  const best1rm = Math.max(...bySession.map(b=>b.top1rm));
  const recent = allSets.slice(-5);
  const trend = bySession.map(b=>b.top1rm);
  return `
    <div class="card">
      <div class="exname" style="margin-bottom:2px">${name}</div>
      ${sparkline(trend)}
      <div class="row" style="font-size:13px"><span class="muted">Heaviest</span><span style="font-weight:800">${heaviest} kg</span></div>
      <div class="row" style="font-size:13px"><span class="muted">Est. 1RM</span><span style="font-weight:800">${best1rm} kg</span></div>
      <div class="divider"></div>
      <table class="mini"><tr><th>DATE</th><th>WEIGHT</th><th>REPS</th></tr>
      ${recent.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${x.weight}kg</td><td>${x.reps}</td></tr>`).join('')}
      </table>
    </div>`;
}

const JUMP_PHASES = [
  {weeks:[1,2], label:'Phase 1：建立期', detail:'兩步助跑跳（7成速度）· 原地CMJ'},
  {weeks:[3,4], label:'Phase 1：建立期', detail:'三步助跑跳 · 跳上箱'},
  {weeks:[5,6], label:'Phase 2：強化期', detail:'完整助跑跳 · 落下跳 20cm'},
  {weeks:[7,8], label:'Phase 2：強化期', detail:'落下跳 30cm'},
  {weeks:[9,10], label:'Phase 3：專項期', detail:'落下跳 40cm · 六角槓跳躍'},
  {weeks:[11,12], label:'Phase 3：專項期', detail:'完整助跑全力測試 · 落下跳 40cm'}
];
function currentJumpPhase(weekNum){
  const w = Math.min(Math.max(weekNum,1), 12);
  return JUMP_PHASES.find(p=>w>=p.weeks[0] && w<=p.weeks[1]) || JUMP_PHASES[JUMP_PHASES.length-1];
}
function programWeekNumber(){
  if(DB.sessions.length===0) return null;
  const firstDate = DB.sessions.reduce((min,s)=> s.date<min?s.date:min, DB.sessions[0].date);
  const first = new Date(firstDate+'T00:00:00');
  const today = new Date(todayISO()+'T00:00:00');
  const days = Math.floor((today-first)/86400000);
  return Math.floor(days/7)+1;
}
function muscleVolumeThisWeek(){
  const sevenDaysAgo = localISO(new Date(Date.now()-7*86400000));
  const counts = {};
  DB.sessions.filter(s=>s.date>=sevenDaysAgo).forEach(s=>{
    s.exercises.forEach(ex=>{
      const m = ex.def.muscle;
      if(!m || m==='跳躍') return;
      const doneCount = ex.sets.filter(x=>x.done).length;
      if(doneCount>0) counts[m] = (counts[m]||0) + doneCount;
    });
  });
  return counts;
}
function mainLiftsTrend(){
  const mainLifts = DB.settings.mode==='home' ? HOME_MAIN : GYM_MAIN;
  return mainLifts.map(name=>{
    const trend = DB.sessions.map(s=>{
      const ex = s.exercises.find(e=>e.def.n===name);
      if(!ex) return null;
      const done = ex.sets.filter(x=>x.done && x.weight!==null);
      if(done.length===0) return null;
      return Math.max(...done.map(x=>estOneRM(x.weight,x.reps)));
    }).filter(v=>v!==null);
    return {name, trend, current: trend.length?trend[trend.length-1]:null};
  });
}

    <h3><span class="num">/</span> B · 主力動作力量趨勢</h3>
    ${lifts.every(l=>l.current===null) ? `<div class="card"><p class="muted" style="font-size:12px">No data yet</p></div>` :
      lifts.map(l=>`
        <div class="card">
          <div class="row"><span class="exname" style="font-size:14px">${l.name}</span><span style="font-weight:800; color:var(--acc)">${l.current!==null?l.current+' kg':'—'}</span></div>

      <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,weekNum/12*100).toFixed(0)}%"></div></div>

  `;

  const mainLifts = DB.settings.mode==='home' ? HOME_MAIN : GYM_MAIN;
  const allNames = new Set();
  DB.sessions.forEach(s=>s.exercises.forEach(e=>{ if(e.def.weighted && e.sets.some(x=>x.done)) allNames.add(e.def.n); }));
  const others = [...allNames].filter(n=>!mainLifts.includes(n));

  let html = mainLifts.map(exerciseProgressCard).join('');
  if(others.length){
    html += `<h3 style="margin-top:16px">其他有紀錄的動作</h3>`;
    html += others.map(exerciseProgressCard).join('');

  return `<h1>PROGRESS</h1><p class="muted">${DB.settings.mode==='home'?'居家版':'健身房版'}主要動作與所有有紀錄的其他動作，趨勢線與數字全部來自你實際記錄的組數</p><div style="height:6px"></div>${html}`;
}

function syncSetFieldsFromDOM(si){
  const ex = state.currentSession.exercises[state.exIndex];
  ['weight','reps','rir'].forEach(field=>{
    const el = document.querySelector(`[data-setfield="${field}"][data-si="${si}"]`);
    if(el) ex.sets[si][field] = el.value===''?null:Number(el.value);
  });
}
function showToast(msg){
  let t = document.getElementById('appToast');
  if(!t){ t=document.createElement('div'); t.id='appToast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1200);
}
function bfDateLabel(dateStr){
  const today = todayISO();
  const yest = localISO(new Date(Date.now()-86400000));
  if(dateStr===today) return '今天';
  if(dateStr===yest) return '昨天';
  const [y,m,d] = dateStr.split('-');
  return `${Number(m)}/${Number(d)}`;
}
function newSession(day, isBackfill){
  return {
    id: 'S'+Date.now(),
    day: day,
    mode: DB.settings.mode,
    date: todayISO(),
    note: '',
    backfill: !!isBackfill,
    exercises: PROGRAM[day].exercises.map(def=>({
      def: def,
      sets: Array.from({length:def.sets}, ()=>({weight:null,reps:null,rir:def.type==='time'?null:'',done:false}))
    }))
  };
}

function bindEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = (e)=>{
      const act = el.dataset.action;
      if(act==='startDay'){ state.currentDay=Number(el.dataset.day); state.currentSession=newSession(state.currentDay,false); state.exIndex=0; state.screen='today'; render(); }
      else if(act==='startBackfill'){ state.currentDay=Number(el.dataset.day); state.currentSession=newSession(state.currentDay,true); state.exIndex=0; state.screen='today'; render(); }
      else if(act==='goWorkout'){ state.screen='workout'; render(); }
      else if(act==='backHome'){ state.screen='home'; render(); }
      else if(act==='openExercise'){ state.exIndex=Number(el.dataset.idx); state.screen='exercise'; render(); }
      else if(act==='backToday'){ state.screen='today'; render(); }
      else if(act==='prevOrNextExercise'){
        const dir = Number(el.dataset.dir);
        if(dir===1 && state.exIndex===state.currentSession.exercises.length-1){ state.screen='today'; }
        else { state.exIndex = Math.max(0, Math.min(state.currentSession.exercises.length-1, state.exIndex+dir)); state.screen='exercise'; }
        render();
      }
      else if(act==='toggleSet'){
        const si = Number(el.dataset.si);
        const ex = state.currentSession.exercises[state.exIndex];
        const s = ex.sets[si];
        if(!s.done){
          syncSetFieldsFromDOM(si);
          const wMissing = ex.def.weighted && (s.weight===null || s.weight===undefined);
          const rMissing = (s.reps===null || s.reps===undefined);
          if(wMissing || rMissing){ alert('請先輸入重量與次數'); return; }
          if((s.weight!==null && s.weight<0) || (s.reps!==null && s.reps<0)){ alert('重量或次數不能是負數'); return; }
          s.done = true;
          if(navigator.vibrate) navigator.vibrate(15);
          showToast('已儲存');
          if(!state.currentSession.backfill) startRestTimer(ex.def.rest);
        } else { s.done = false; }
        render();
      }
      else if(act==='step'){
        const si = Number(el.dataset.si), field = el.dataset.field, delta = Number(el.dataset.delta);
        const input = document.querySelector(`[data-setfield="${field}"][data-si="${si}"]`);
        if(!input || input.disabled) return;
        const cur = input.value===''?0:Number(input.value);
        let next = cur + delta;
        if(next<0) next=0;
        if(field==='weight') next = Math.round(next*10)/10;
        input.value = next;
        syncSetFieldsFromDOM(si);
      }
      else if(act==='finishWorkout'){ state.screen='complete'; render(); }
      else if(act==='saveAndFinish'){
        const note = document.getElementById('sessionNote').value;
        state.currentSession.note = note;
        DB.sessions.push(state.currentSession);
        DB.sessions.sort((a,b)=> a.date===b.date ? (a.id<b.id?-1:1) : (a.date<b.date?-1:1));
        saveDB();
        state.currentSession=null; state.screen='home'; render();
      }
      else if(act==='viewSession'){ state.viewingId = el.dataset.id; state.screen='sessionDetail'; render(); }
      else if(act==='backHistory'){ state.screen='history'; render(); }
      else if(act==='bfDaysAgo'){
        const delta = Number(el.dataset.delta);
        const cur = new Date(state.currentSession.date+'T12:00:00');
        const next = new Date(cur.getTime() - delta*86400000);
        const today = new Date(todayISO()+'T12:00:00');
        if(next.getTime() > today.getTime()) return; // 不能選未來
        state.currentSession.date = localISO(next);
        render();
      }
      else if(act==='toggleTheme'){ DB.settings.theme = DB.settings.theme==='dark'?'light':'dark'; applyTheme(); saveDB(); render(); }
      else if(act==='toggleMode'){
        if(state.currentSession){ alert('請先完成或離開目前訓練，再切換健身房／居家模式'); return; }
        DB.settings.mode = DB.settings.mode==='home'?'gym':'home';
        applyMode(); saveDB(); render();
      }
      else if(act==='logBW'){
        const v = Number(document.getElementById('bwInput').value);
        if(!v){ alert('請輸入體重'); return; }
        DB.bodyweight.push({date:todayISO(), weight:v}); saveDB(); render();
      }
      else if(act==='exportData'){ document.getElementById('exportBox').value = JSON.stringify(DB, null, 2); }
      else if(act==='importData'){
        try{
          const parsed = JSON.parse(document.getElementById('importBox').value);
          if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.sessions)){
            alert('Import failed：JSON 缺少必要的 sessions 欄位，資料未變更');
            return;
          }
          if(!Array.isArray(parsed.bodyweight)) parsed.bodyweight = [];
          if(!Array.isArray(parsed.notes)) parsed.notes = [];
          if(!parsed.settings || typeof parsed.settings!=='object') parsed.settings = {theme:'light', mode:'gym'};
          DB = parsed; saveDB(); applyTheme(); applyMode(); render(); alert('匯入完成');
        }
        catch(err){ alert('JSON 格式錯誤，匯入失敗，資料未變更'); }
      }
      else if(act==='resetData'){
        if(confirm('確定要清除所有訓練紀錄嗎？此動作無法復原。')){
          DB = {sessions:[], notes:[], bodyweight:[], settings:DB.settings};
          saveDB(); render();
        }
      }
    };
  });
  document.querySelectorAll('[data-setfield]').forEach(el=>{
    el.oninput = ()=>{
      const si = Number(el.dataset.si);
      const field = el.dataset.setfield;
      const ex = state.currentSession.exercises[state.exIndex];
      ex.sets[si][field] = el.value===''?null:Number(el.value);
    };
  });
  document.querySelectorAll('.navitem').forEach(el=>{
    el.onclick = ()=>{
      const nav = el.dataset.nav;
      if(nav==='workout' && state.currentSession){ state.screen='today'; }
      else { state.screen = nav; }
      render();
    };
  });
}

function startRestTimer(seconds){
  state.timerEndAt = Date.now() + seconds*1000;
  state.timerPausedLeft = null;
  const overlay = document.createElement('div');
  overlay.className = 'timer-overlay';
  overlay.id = 'timerOverlay';
  overlay.innerHTML = `
    <div class="timer-label">REST</div>
    <div class="timer-num" id="timerNum">${fmtTime(seconds)}</div>
    <div class="timer-controls">
      <button class="timer-btn" id="tMinus">-30s</button>
      <button class="timer-btn" id="tPause">Pause</button>
      <button class="timer-btn" id="tSkip">Skip</button>
      <button class="timer-btn" id="tPlus">+30s</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('tMinus').onclick = ()=>{
    if(state.timerPausedLeft!==null) state.timerPausedLeft = Math.max(0, state.timerPausedLeft-30000);
    else state.timerEndAt = Math.max(Date.now(), state.timerEndAt-30000);
    updateTimerDisplay();
  };
  document.getElementById('tPlus').onclick = ()=>{
    if(state.timerPausedLeft!==null) state.timerPausedLeft += 30000;
    else state.timerEndAt += 30000;
    updateTimerDisplay();
  };
  document.getElementById('tPause').onclick = (e)=>{
    if(state.timerPausedLeft===null){
      state.timerPausedLeft = Math.max(0, state.timerEndAt - Date.now());
      e.target.textContent = 'Resume';
    } else {
      state.timerEndAt = Date.now() + state.timerPausedLeft;
      state.timerPausedLeft = null;
      e.target.textContent = 'Pause';
    }
    updateTimerDisplay();
  };
  document.getElementById('tSkip').onclick = closeTimer;
  state.timerInterval = setInterval(tickTimer, 250);
}
function remainingMs(){
  if(state.timerPausedLeft!==null) return state.timerPausedLeft;
  return Math.max(0, state.timerEndAt - Date.now());
}
function tickTimer(){
  if(state.timerPausedLeft===null && remainingMs()<=0){
    closeTimer();
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    return;
  }
  updateTimerDisplay();
}
function updateTimerDisplay(){
  const n=document.getElementById('timerNum');
  if(n) n.textContent = fmtTime(Math.ceil(remainingMs()/1000));
}
function fmtTime(s){ const m=Math.floor(s/60), sec=s%60; return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec; }
function closeTimer(){ clearInterval(state.timerInterval); state.timerPausedLeft=null; const o=document.getElementById('timerOverlay'); if(o) o.remove(); }

document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && document.getElementById('timerOverlay')) tickTimer();
});

loadDB().then(render);
</script>
