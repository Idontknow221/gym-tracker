// B3：不要一開始就 Math.round 成整數——那會讓兩組實際不同的估算值被夾成同一個整數，
// PR 比較跟趨勢線都會失真。改成保留一位小數，UI 顯示照樣是一位小數，不影響閱讀。
function estOneRM(w,r){ if(!w||!r) return 0; return Math.round(w*(1+r/30)*10)/10; }

function sparkline(points){
  if(points.length<2) return '';
  const w=340, h=88, pad=8;
  const min = Math.min(...points), max = Math.max(...points);
  const range = (max-min) || 1;
  const stepX = w/(points.length-1);
  const xy = points.map((v,i)=>[i*stepX, h - ((v-min)/range)*(h-pad*2) - pad]);
  const line = xy.map(c=>c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const lastPt = xy[xy.length-1];
  // B2：波動範圍相對絕對值很小時（例如體重70kg只變0.8kg），標一行「縱軸已放大」，
  // 避免小波動被拉滿整個高度、看起來像劇烈變化。
  const absLevel = Math.max(...points.map(Math.abs)) || 1;
  const scaledUp = (range/absLevel) < 0.05;
  // B2修正：拿掉 preserveAspectRatio="none"（會把圓點壓扁變橢圓），viewBox 改成正方比例安全的高度，
  // 讓 SVG 用預設的等比縮放。面積填色透明度大幅降低，線才是主視覺，不是底下那片色塊。
  return `<div class="plot"><svg viewBox="0 0 ${w} ${h}" height="${h}" aria-hidden="true">
    <polyline points="${line}" fill="none" stroke="var(--mark)" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="3.2" fill="var(--mark)"/>
  </svg></div>${scaledUp?'<div class="muted" style="font-size:10.5px">縱軸已放大以看清小幅波動，不是變化真的這麼劇烈</div>':''}`;
}

// A5/B2：原始值淡點 + 移動平均實線。前 window-1 個點不是完整的 window 次平均，
// 不能跟後面的實線平均線混在一起看，所以只從第 window 個點開始畫平均實線，
// 前面那幾個點只用原始值的淡點表示，不假裝已經有平均可看。
// Y軸波動如果相對絕對值很小（例如35cm裡面只變1cm），额外標一行「縱軸已放大」，避免誤導成劇烈變化。
function rollingSparkline(raw, window){
  if(raw.length<2) return '';
  const w=340, h=88, pad=8;
  const smoothed = rollingAverage(raw, window);
  const allVals = raw.concat(smoothed.slice(window-1));
  const min = Math.min(...allVals), max = Math.max(...allVals);
  const range = (max-min) || 1;
  const stepX = w/(raw.length-1);
  const rawXY = raw.map((v,i)=>[i*stepX, h - ((v-min)/range)*(h-pad*2) - pad]);
  const smoothXY = smoothed.map((v,i)=>[i*stepX, h - ((v-min)/range)*(h-pad*2) - pad]);
  const solidStart = window-1; // 只有這之後的點才是真的 window 次平均
  const solidLine = smoothXY.slice(solidStart).map(c=>c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const lastPt = smoothXY[smoothXY.length-1];
  // 相對波動幅度小於絕對值的 5% 時，視為「縱軸有放大」
  const absLevel = Math.max(...raw.map(Math.abs)) || 1;
  const scaledUp = (range/absLevel) < 0.05;
  return `<div class="plot"><svg viewBox="0 0 ${w} ${h}" height="${h}" aria-hidden="true">
    ${rawXY.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.2" fill="var(--mark)" opacity=".28"/>`).join('')}
    ${solidLine ? `<polyline points="${solidLine}" fill="none" stroke="var(--mark)" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="3.2" fill="var(--mark)"/>` : ''}
  </svg></div>${scaledUp?'<div class="muted" style="font-size:10.5px">縱軸已放大以看清小幅波動，不是變化真的這麼劇烈</div>':''}`;
}

// A4：兩條線按同一組週次對齊，缺資料的那週留空、不硬連過去，不同長度的線不並排。
function alignedWeekSparkline(values){
  const pts = values.map((v,i)=>({v,i})).filter(p=>p.v!==null);
  if(pts.length<2) return '';
  const w=340, h=88, pad=8;
  const allV = pts.map(p=>p.v);
  const min=Math.min(...allV), max=Math.max(...allV), range=(max-min)||1;
  const stepX = w/(Math.max(values.length-1,1));
  // 依「連續有值」切段，段跟段之間空一格不連線
  const segments = [];
  let cur = [];
  values.forEach((v,i)=>{
    if(v===null){ if(cur.length) segments.push(cur); cur=[]; return; }
    cur.push([i*stepX, h-((v-min)/range)*(h-pad*2)-pad]);
  });
  if(cur.length) segments.push(cur);
  const lastSeg = segments[segments.length-1];
  const lastPt = lastSeg[lastSeg.length-1];
  return `<div class="plot"><svg viewBox="0 0 ${w} ${h}" height="${h}" aria-hidden="true">
    ${segments.map(seg=>{
      if(seg.length===1) return `<circle cx="${seg[0][0].toFixed(1)}" cy="${seg[0][1].toFixed(1)}" r="2.6" fill="var(--mark)" opacity=".6"/>`;
      const line = seg.map(c=>c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
      return `<polyline points="${line}" fill="none" stroke="var(--mark)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity=".85"/>`;
    }).join('')}
    <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="3.2" fill="var(--mark)"/>
  </svg></div>`;
}


function exerciseProgressCard(name){
  const bySession = DB.sessions.map(s=>{
    const ex = s.exercises.find(e=>e.def.n===name);
    if(!ex) return null;
    const done = ex.sets.filter(x=>x.done && x.weight!==null);
    if(done.length===0) return null;
    const volume = done.reduce((a,x)=>a+(x.weight*x.reps),0);
    return { date:s.date, top1rm: Math.max(...done.map(x=>estOneRM(x.weight,x.reps))), sets:done, volume };
  }).filter(Boolean);
  if(bySession.length===0){
    return `<div class="trend"><div class="trend-head"><div>
      <div style="font-weight:700; font-size:15.5px">${dn(name)}</div>
      <div class="en">${name}</div></div></div>
      <p class="muted" style="font-size:12.5px; margin-top:8px">還沒有紀錄</p></div>`;
  }
  const allSets = bySession.flatMap(b=>b.sets.map(s=>({...s,date:b.date})));
  const heaviest = Math.max(...allSets.map(x=>x.weight||0));
  const best1rm = Math.max(...bySession.map(b=>b.top1rm));
  const trend = bySession.map(b=>b.top1rm);
  const volTrend = bySession.map(b=>b.volume);
  const diff = trend.length>1 ? Math.round((trend[trend.length-1]-trend[0])*10)/10 : 0;
  const open = state.openTrend===name;
  const recent = allSets.slice(-6).reverse();
  return `
    <div class="trend" data-action="toggleTrend" data-name="${name}" style="cursor:pointer">
      <div class="trend-head">
        <div><div style="font-weight:700; font-size:15.5px">${dn(name)}</div>
        <div class="en">${name}</div></div>
        <span class="delta ${diff>0?'':'flat'}">${diff>0?'+':''}${diff} KG 1RM</span>
      </div>
      ${sparkline(trend)}
      <div class="readout">
        <div><span class="label">最重</span><b>${heaviest}</b></div>
        <div><span class="label">推估 1RM</span><b>${best1rm}</b></div>
        <div><span class="label">訓練次數</span><b>${bySession.length}</b></div>
      </div>
      ${volTrend.length>1 ? `
      <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line2)">
        <div class="label" style="margin-bottom:6px">單次訓練量（重量×次數加總，不等於練得更大）</div>
        ${sparkline(volTrend)}
      </div>` : ''}
      ${open ? `
      <div class="divider"></div>
      <div class="label" style="margin-bottom:8px">最近幾組</div>
      ${recent.map(x=>`<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line2); font-size:13.5px">
        <span class="muted">${fmtDate(x.date)}</span>
        <span style="font-family:var(--rounded); font-weight:700">${x.weight} kg × ${x.reps}</span></div>`).join('')}
      ` : `<div class="label" style="margin-top:10px; opacity:.6">點一下看逐組數字</div>`}
    </div>`;
}

// 純描述性呈現「這幾週練了幾次」，刻意不下任何「練越多越好」的結論——
// 頻率統合分析顯示 6–12 週內不同頻率對力量成長沒有顯著差異，規律與否才是重點，
// 但規律本身也只呈現趨勢，不代表訓練效果的因果保證。
function consistencyCard(){
  if(DB.sessions.length<2) return '';
  const dates = DB.sessions.map(s=>s.date).sort();
  const [y0,m0,d0] = dates[0].split('-').map(Number);
  const start = new Date(y0,m0-1,d0);
  const [ty,tm,td] = todayISO().split('-').map(Number);
  const today = new Date(ty,tm-1,td);
  const totalWeeks = Math.min(16, Math.max(1, Math.ceil((today-start)/86400000/7)+1));
  const counts = Array.from({length:totalWeeks}, ()=>0);
  DB.sessions.forEach(s=>{
    const [sy,sm,sd] = s.date.split('-').map(Number);
    const wk = Math.floor((new Date(sy,sm-1,sd)-start)/86400000/7);
    if(wk>=0 && wk<totalWeeks) counts[wk]++;
  });
  const max = Math.max(1, ...counts);
  return `
    <div style="padding:18px 0; border-bottom:1px solid var(--line2)">
      <div class="label" style="margin-bottom:12px">每週訓練次數・共 ${totalWeeks} 週</div>
      <div style="display:flex; align-items:flex-end; gap:4px; height:64px">

}

// ===== 週訓練量趨勢（tonnage + 完成組數，各自獨立折線，不做雙軸）=====
// 查證結果：雙Y軸圖表會扭曲讀者對兩條數列關係的判斷（多篇視覺化研究含控制實驗證實），
// 所以噸數跟完成組數分開畫兩條線，不合併成一張雙軸圖。
function weeklyVolumeCard(){
  if(DB.sessions.length<2) return '';
  const dates = DB.sessions.map(s=>s.date).sort();
  const [y0,m0,d0] = dates[0].split('-').map(Number);
  const start = new Date(y0,m0-1,d0);
  const [ty,tm,td] = todayISO().split('-').map(Number);
  const today = new Date(ty,tm-1,td);
  const totalWeeks = Math.min(16, Math.max(1, Math.ceil((today-start)/86400000/7)+1));
  const tonnage = Array.from({length:totalWeeks}, ()=>0);
  const setCount = Array.from({length:totalWeeks}, ()=>0);
  DB.sessions.forEach(s=>{
    const [sy,sm,sd] = s.date.split('-').map(Number);
    const wk = Math.floor((new Date(sy,sm-1,sd)-start)/86400000/7);
    if(wk<0 || wk>=totalWeeks) return;
    s.exercises.forEach(e=>{
      e.sets.filter(x=>x.done).forEach(x=>{
        setCount[wk]++;
        if(x.weight!==null && x.reps!==null) tonnage[wk] += (Number(x.weight)||0)*(Number(x.reps)||0);
      });
    });
  });

// ===== 跳躍測試內穩定度（同一天同類型≥3筆才算，CV%）=====
function jumpConsistencySessions(){
  const valid = DB.jumpMeasurements.filter(m=>!m.familiarization && m.status==='OK');
  const groups = {};
  valid.forEach(m=>{
    const key = m.date+'_'+m.type;
    if(!groups[key]) groups[key] = [];
    const d = jumpDisplayHeight(m);
    if(d.value!==null) groups[key].push(d.value);
  });
  return Object.entries(groups)
    .filter(([k,vals])=>vals.length>=3)
    .map(([k,vals])=>{
      const [date,type] = k.split('_');
      const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
      // B7：用樣本標準差（除以 n-1），不是母體標準差——這幾跳是抽樣，不是母體全部，
      // 除以 n 會系統性低估變異，CV% 看起來比實際更穩定。
      const sd = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(vals.length-1));
      const cv = mean>0 ? Math.round(sd/mean*1000)/10 : null;
      return {date, type, vals, mean:Math.round(mean*10)/10, cv};
    })
    .sort((a,b)=>a.date<b.date?1:-1);
}
function jumpConsistencyCard(){
  const sessions = jumpConsistencySessions();
  if(!sessions.length) return '';
  const latest = sessions[0];
  return `<div class="card" style="margin:0 0 14px">
    <div class="label">跳躍測試內穩定度（CV%）</div>
    <div class="muted" style="font-size:12px; margin-top:6px; line-height:1.6">
      最近一次同天測${latest.vals.length}跳（${fmtDate(latest.date)}・${JUMP_TYPES[latest.type]||latest.type}）：
      平均 ${latest.mean}cm，CV ${latest.cv!==null?latest.cv+'%':'—'}。
      CV 越低代表這幾跳彼此越接近；同樣的平均值，CV 高代表某幾跳特別不穩，不是「今天狀態比較差」就能解釋，也可能是動作不一致。這只是「這次測得穩不穩」，不是訓練 KPI，不要拿來跟別人比較或當成訓練效果指標。
    </div>
    ${sessions.length>1?`<div class="muted" style="font-size:11px; margin-top:8px">近期同天多跳測驗的CV：${sessions.slice(0,6).map(s=>s.cv+'%').join('、')}</div>`:''}
  </div>`;
}

// ===== PR 時間軸：只標「真的突破」的那幾個點，不是連續趨勢 =====
function prTimelineEvents(){
  const mains = DB.settings.mode==='home' ? HOME_MAIN : GYM_MAIN;
  const events = [];
  mains.forEach(name=>{
    let best = -Infinity;
    DB.sessions.filter(s=>s.date).sort((a,b)=>a.date<b.date?-1:1).forEach(s=>{
      const ex = s.exercises.find(e=>e.def.n===name);
      if(!ex) return;
      const done = ex.sets.filter(x=>x.done && x.weight!==null && x.reps!==null);
      if(!done.length) return;
      const e1rm = Math.max(...done.map(x=>estOneRM(x.weight,x.reps)));
      if(e1rm > best){ best = e1rm; events.push({name, date:s.date, e1rm:Math.round(e1rm*10)/10}); }
    });
  });
  return events.sort((a,b)=>a.date<b.date?1:-1);
}
function prTimelineCard(){
  const events = prTimelineEvents();
  if(events.length<2) return '';
  return `<div class="card" style="margin:0 0 14px">
    <div class="label">個人紀錄時間軸（推估1RM每次真的突破的點）</div>
    <div class="tl" style="padding-left:0; margin-top:8px">

  </div>`;
}

// ===== 訓練量×跳躍表現（並排小圖，不做雙軸；資料不足就老實說不足）=====
function trainingVsJumpCard(){
  if(DB.sessions.length<2) return '';
  const okCmj = DB.jumpMeasurements.filter(m=>m.type==='CMJ' && !m.familiarization && m.status==='OK');
  if(okCmj.length<4) return `<div class="card" style="margin:0 0 14px">
    <div class="label">訓練量 × 跳躍表現</div>
    <p class="muted" style="font-size:12px; margin-top:6px">目前資料量還不夠看這個關聯——需要至少4次以上OK的跳躍測量，現在有 ${okCmj.length} 次。資料夠了會自動顯示。</p>
  </div>`;

  // A4修正：兩條線一定用同一組週次索引，不是各自算各自的長度再並排（那是版面謊言）。
  // 用「訓練資料開始的那週」當共同起點，同一個週次索引同時對應噸數跟CMJ平均。
  const allDates = DB.sessions.map(s=>s.date).concat(okCmj.map(m=>m.date)).sort();
  const [y0,m0,d0] = allDates[0].split('-').map(Number);
  const start = new Date(y0,m0-1,d0);
  const [ty,tm,td] = todayISO().split('-').map(Number);
  const today = new Date(ty,tm-1,td);
  const totalWeeks = Math.min(16, Math.max(1, Math.ceil((today-start)/86400000/7)+1));
  const weekOf = dateStr => {
    const [y,m,d] = dateStr.split('-').map(Number);
    return Math.floor((new Date(y,m-1,d)-start)/86400000/7);
  };

  const tonnage = Array.from({length:totalWeeks}, ()=>0);
  DB.sessions.forEach(s=>{
    const wk = weekOf(s.date);
    if(wk<0 || wk>=totalWeeks) return;
    s.exercises.forEach(e=>e.sets.filter(x=>x.done).forEach(x=>{
      if(x.weight!==null && x.reps!==null) tonnage[wk] += (Number(x.weight)||0)*(Number(x.reps)||0);
    }));
  });

  // 同一週有多筆CMJ就取平均；沒有測的週留 null，不要硬連過去
  const cmjByWeek = Array.from({length:totalWeeks}, ()=>[]);
  okCmj.forEach(m=>{
    const wk = weekOf(m.date);
    if(wk<0 || wk>=totalWeeks) return;
    const v = jumpDisplayHeight(m).value;
    if(v!==null) cmjByWeek[wk].push(v);
  });
  const cmjWeekly = cmjByWeek.map(arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*10)/10 : null);

  const weeksWithTraining = tonnage.filter(t=>t>0).length;
  const weeksWithJump = cmjWeekly.filter(v=>v!==null).length;
  if(weeksWithTraining<4 || weeksWithJump<4) return `<div class="card" style="margin:0 0 14px">
    <div class="label">訓練量 × 跳躍表現</div>
    <p class="muted" style="font-size:12px; margin-top:6px">對齊到同一組週次後，有訓練紀錄的週數（${weeksWithTraining}）或有跳躍測量的週數（${weeksWithJump}）還不到4週，暫時不顯示這張圖，資料夠了會自動出現。</p>
  </div>`;

  return `<div class="card" style="margin:0 0 14px">
    <div class="label">訓練量 × 跳躍表現（同一組週次對齊）</div>
    <div class="muted" style="font-size:11.5px; margin-bottom:4px">週訓練量（噸數）</div>
    ${alignedWeekSparkline(tonnage.map(t=>t>0?t:null))}
    <div class="muted" style="font-size:11.5px; margin:10px 0 4px">週CMJ平均（沒測的週留空，不連線）</div>
    ${alignedWeekSparkline(cmjWeekly)}
    <p class="muted" style="font-size:11px; margin-top:8px; line-height:1.6">
      兩條線用同一組週次對齊，不是各自長度硬並排。沒測跳躍的週留空、不連過去。這只是放在一起看「同時期的樣子」，不是同一張圖、也不代表因果——訓練量變化不代表就是跳躍表現變化的原因，兩者可能各自受其他因素影響。看到同步變化只能說「值得注意」，不能直接下結論。
    </p>
  </div>`;
}

// 其餘4項是主觀感受，沒有對應的量化資料——刻意不自己發明門檻去猜，寧可誠實顯示
// 「需要自行評估」，也不要編一個假的判斷去冒充有在幫你分析。

// 但那個合併權重（這項佔多少%）本身沒有文獻依據，寫出來就是假裝有科學根據的偽精確。
// 使用者自己看這幾項證據、自己判斷比較誠實。
function checkDeloadSigns(){
  const mains = DB.settings.mode==='home' ? HOME_MAIN : GYM_MAIN;
  // PHASE 4：只算真的 WEIGHT_PLATEAU（卡住），不算 REP_PLATEAU（次數其實在進步，
  // 只是還沒到範圍上限）——後者不該被當成「卡關證據」列進來，那會誤導判斷。
  const plateauCount = mains.filter(n=>{
    const def = Object.values(PROGRAM).flatMap(d=>d.exercises).find(e=>e.n===n && e.main);
    const s = def && suggestNextLoad(def);
    return s && s.plateau && s.plateauType!=='REP_PLATEAU';
  }).length;
  const jt = jumpTestSummary();
  const jumpDropped = jt && (jt.bestGap - jt.latestGap >= 3);

  // 睡眠／精力現在有真的資料可查（checkin），用跟自己過去28天比較的偏差標記，
  // 不是拿外部標準硬套；資料不夠時誠實回傳不可查，不硬湊。
  const lastSession = DB.sessions.length ? DB.sessions[DB.sessions.length-1] : null;
  let sleepFlag = {status:'NO_INPUT'}, energyFlag = {status:'NO_INPUT'};
  if(lastSession){
    const flags = readinessDeviationFlags(lastSession);
    sleepFlag = flags.find(f=>f.field==='sleepHours');
    energyFlag = flags.find(f=>f.field==='energy');
  }
  const sleepCheckable = sleepFlag.status==='FLAGGED' || sleepFlag.status==='NORMAL';
  const energyCheckable = energyFlag.status==='FLAGGED' || energyFlag.status==='NORMAL';

  return [
    {checkable:true, triggered: plateauCount>=2, detail: plateauCount>0 ? `目前 ${plateauCount} 個主力動作連續卡關` : null},
    {checkable:false},
    {checkable:true, triggered: !!jumpDropped, detail: jt ? `最新摸高 ${jt.latestGap>=0?'+':''}${jt.latestGap}cm，歷史最佳 ${jt.bestGap>=0?'+':''}${jt.bestGap}cm` : null},
    {checkable:sleepCheckable, triggered: sleepCheckable && sleepFlag.status==='FLAGGED',
      detail: sleepCheckable ? `最近一次紀錄睡眠 ${sleepFlag.todayVal}h，近28天平均 ${sleepFlag.mean}h` : null},
    {checkable:energyCheckable, triggered: energyCheckable && energyFlag.status==='FLAGGED',
      detail: energyCheckable ? `最近一次紀錄精力 ${energyFlag.todayVal}/5，近28天平均 ${energyFlag.mean}/5` : null},
    {checkable:false}
  ];
}

function syncSetFieldsFromDOM(si){
  const ex = state.currentSession.exercises[state.exIndex];
  ['weight','reps','rir'].forEach(field=>{
    const el = document.querySelector(`[data-setfield="${field}"][data-si="${si}"]`);
    if(!el) return;
    // 這裡本來就正確區分空字串(null)跟真的填0（保留0，不是當成沒填）——這條不動。
    // 只補NaN防呆：貼上非數字字串這種邊界情況，不要讓NaN悄悄存進資料裡。
    if(el.value===''){ ex.sets[si][field] = null; return; }
    const n = Number(el.value);
    ex.sets[si][field] = isNaN(n) ? null : n;
  });
}
function showToast(msg){
  let t = document.getElementById('appToast');
  if(!t){ t=document.createElement('div'); t.id='appToast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1200);
}
function newSession(day, isBackfill){
  return {
    id: 'S'+Date.now(),
    day: day,
    mode: DB.settings.mode,
    date: todayISO(),
    note: '',
    backfill: !!isBackfill,
    // 補登的訓練不是「現在」發生的，記錄開始時間毫無意義（會量到打字補登的時間，
    // 不是實際運動時長），所以只有現場訓練才記 startTime。
    startTime: isBackfill ? null : Date.now(),
    endTime: null,
    checkin: {energy:null, soreness:null, sleepHours:null},
    deload: false,
    // B5：def 一律 shallow clone，不要直接掛 PROGRAM 範本的參照——
    // PROGRAM_HOME[5] 跟 PROGRAM_GYM[5] 目前是同一個物件，沒 clone 的話任何未來
    // 對 ex.def 欄位的修改都會同時污染居家版跟健身房版的 Day 5 範本。
    exercises: PROGRAM[day].exercises.map(def=>({
      def: {...def},
      sets: Array.from({length:def.sets}, ()=>({weight:null,reps:null,rir:def.type==='time'?null:'',done:false}))
    }))
  };
}

function bindEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = (e)=>{
      const act = el.dataset.action;
      if(act==='startDay'){ state.currentDay=Number(el.dataset.day); state.currentSession=newSession(state.currentDay,false); state.exIndex=0; state.screen='today'; render(); }
      else if(act==='startBackfill'){ state.currentDay=Number(el.dataset.day); state.currentSession=newSession(state.currentDay,true); state.exIndex=0; state.screen='today'; render(); }
      else if(act==='goWorkout'){ state.screen='workout'; render(); }
      else if(act==='previewDay'){ state.previewDay=Number(el.dataset.day); state.screen='preview'; render(); }
      else if(act==='backWorkout'){ state.screen='workout'; render(); }
      else if(act==='backHome'){
        if(state.screen==='today' && state.currentSession){
          const doneCount = state.currentSession.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
          if(doneCount>0 && !confirm('已經記錄了 '+doneCount+' 組，離開會取消這次訓練（不會存檔），確定要離開嗎？')) return;
          state.currentSession = null;
        }
        state.screen='home'; render();
      }
      else if(act==='openExercise'){ state.exIndex=Number(el.dataset.idx); state.screen='exercise'; render(); }
      else if(act==='swapExercise'){
        const ex = state.currentSession.exercises[state.exIndex];
        const subInfo = GYM_SUBSTITUTE[ex.def.n];
        if(!subInfo) return;
        const newDef = findSubstituteDef(subInfo.sub);
        if(!newDef){ alert('找不到對應的替代動作'); return; }
        ex.def = newDef;
        ex.sets = Array.from({length:newDef.sets}, ()=>({weight:null, reps:null, rir:newDef.type==='time'?null:'', done:false}));
        render();
      }
      else if(act==='backToday'){ state.screen='today'; render(); }
      else if(act==='prevOrNextExercise'){
        const dir = Number(el.dataset.dir);
        if(dir===1 && state.exIndex===state.currentSession.exercises.length-1){ state.screen='today'; }
        else { state.exIndex = Math.max(0, Math.min(state.currentSession.exercises.length-1, state.exIndex+dir)); state.screen='exercise'; }
        render();
      }
      else if(act==='toggleSet'){
        const si = Number(el.dataset.si);
        const ex = state.currentSession.exercises[state.exIndex];
        const s = ex.sets[si];
        if(!s.done){
          syncSetFieldsFromDOM(si);
          const wMissing = ex.def.weighted && (s.weight===null || s.weight===undefined);
          const rMissing = (s.reps===null || s.reps===undefined);
          if(wMissing || rMissing){ alert('請先輸入重量與次數'); return; }
          if((s.weight!==null && s.weight<0) || (s.reps!==null && s.reps<0)){ alert('重量或次數不能是負數'); return; }
          s.done = true;
          state.justSet = si;
          if(navigator.vibrate) navigator.vibrate(15);
          showToast('已儲存');
          if(!state.currentSession.backfill) startRestTimer(ex.def.rest);
        } else { s.done = false; state.justSet = null; }
        render();
        state.justSet = null;
      }
      else if(act==='step'){
        const si = Number(el.dataset.si), field = el.dataset.field, delta = Number(el.dataset.delta);
        const input = document.querySelector(`[data-setfield="${field}"][data-si="${si}"]`);
        if(!input || input.disabled) return;
        const cur = input.value===''?0:Number(input.value);
        let next = cur + delta;
        if(next<0) next=0;
        if(field==='weight') next = Math.round(next*10)/10;
        input.value = next;
        syncSetFieldsFromDOM(si);
      }
      else if(act==='finishWorkout'){ state.screen='complete'; render(); }
      else if(act==='saveAndFinish'){
        const note = document.getElementById('sessionNote').value;
        state.currentSession.note = note;
        const sleepEl = document.getElementById('sleepHoursInput');
        const sleepVal = sleepEl ? Number(sleepEl.value) : NaN;
        state.currentSession.checkin = state.currentSession.checkin || {energy:null, soreness:null, sleepHours:null};
        state.currentSession.checkin.sleepHours = (sleepEl && sleepEl.value!=='' && !isNaN(sleepVal)) ? sleepVal : null;
        // 只有本來就有 startTime（非補登）才蓋 endTime；補登場次兩者都留 null，
        // 詳細頁會直接不顯示時長，不會冒出一個假的「0分鐘」。
        if(state.currentSession.startTime) state.currentSession.endTime = Date.now();
        DB.sessions.push(state.currentSession);
        DB.sessions.sort((a,b)=> a.date===b.date ? (a.id<b.id?-1:1) : (a.date<b.date?-1:1));
        saveDB();
        state.currentSession=null; state.screen='home'; render();
      }
      else if(act==='viewSession'){ state.viewingId = el.dataset.id; state.screen='sessionDetail'; render(); }
      else if(act==='backHistory'){ state.screen='history'; render(); }
      else if(act==='backMore'){ state.screen='more'; render(); }
      else if(act==='openReference'){ state.screen='reference'; render(); }
      else if(act==='openJumpImport'){ state.jumpImportPreview=null; state.screen='jumpImport'; render(); }
      else if(act==='backJumpImport'){ state.jumpImportPreview=null; state.screen='jumpCategory'; render(); }
      else if(act==='parseJumpCsv'){
        const text = document.getElementById('jumpCsvInput').value;
        if(!text.trim()){ alert('請先貼上內容'); return; }
        const device = document.getElementById('jumpCsvDevice').value.trim() || 'My Jump 2';
        const familiarization = document.getElementById('jumpCsvFamiliarization').checked;
        const result = parseJumpCsvText(text, {device, familiarization});
        if(result.error){ alert(result.error); return; }
        state.jumpImportPreview = result; render();
      }
      else if(act==='cancelJumpImport'){ state.jumpImportPreview=null; render(); }
      else if(act==='confirmJumpImport'){
        if(state.jumpImportPreview){
          const existingKeys = new Set(DB.jumpMeasurements.map(jumpDedupKey));
          let added=0, skipped=0;
          state.jumpImportPreview.entries.forEach(e=>{
            const key = jumpDedupKey(e);
            if(existingKeys.has(key)){ skipped++; return; }
            existingKeys.add(key);
            DB.jumpMeasurements.push(e); added++;
          });
          state.jumpImportPreview = null; saveDB();
          alert('匯入完成：新增 '+added+' 筆，略過重複 '+skipped+' 筆');
        }
        render();
      }
      else if(act==='saveManualJump'){
        const vals = {
          type: document.getElementById('jmType').value,
          date: document.getElementById('jmDate').value,
          heightCm: document.getElementById('jmHeight').value,
          flightTimeMs: document.getElementById('jmFlight').value,
          contactTimeMs: document.getElementById('jmContact').value,
          rsi: document.getElementById('jmRsi').value,
          device: document.getElementById('jmDevice').value.trim() || 'My Jump 2',
          familiarization: document.getElementById('jmFamiliarization').checked,
          source: 'manual'
        };
        if(!vals.heightCm && !vals.flightTimeMs){ alert('高度跟飛行時間至少要填一個'); return; }
        const entry = buildJumpEntry(vals);
        if(entry.status==='NEEDS_REVIEW' && !confirm('這筆資料有問題：\n'+entry.flags.join('\n')+'\n仍要儲存嗎？')) return;
        DB.jumpMeasurements.push(entry); saveDB(); render();
      }
      else if(act==='openFvProfile'){ state.fvDraft=null; state.screen='fvProfile'; render(); }
      else if(act==='openSettingsGeneral'){ state.screen='settingsGeneral'; render(); }
      else if(act==='openBodyMetrics'){ state.screen='bodyMetrics'; render(); }
      else if(act==='openJumpCategory'){ state.screen='jumpCategory'; render(); }
      else if(act==='backFvProfile'){ state.fvDraft=null; state.screen='jumpCategory'; render(); }
      else if(act==='startFvDraft'){
        const bodyMassKg = document.getElementById('fvBodyMass').value;
        const pushOffCm = document.getElementById('fvPushOff').value;
        state.fvDraft = fvBuildProfile({bodyMassKg, pushOffCm});
        render();
      }
      else if(act==='cancelFvDraft'){ state.fvDraft=null; render(); }
      else if(act==='addFvTrial'){
        const loadKg = Number(document.getElementById('fvTrialLoad').value);
        const heightCm = Number(document.getElementById('fvTrialHeight').value);
        if(!heightCm){ alert('請填跳躍高度'); return; }
        state.fvDraft.trials.push({loadKg: loadKg||0, heightCm});
        render();
      }
      else if(act==='saveFvDraft'){
        // B4：公式還是不算（這條不動），但至少要3個不同負重才能存成一份剖面——
        // 1跳只是一個點，不構成剖面，存起來會誤導以為是完整的一次測驗。
        const distinctLoads = new Set(state.fvDraft.trials.map(t=>t.loadKg)).size;
        if(distinctLoads<3){ alert('至少要有3個不同負重才能存成一份剖面（目前 '+distinctLoads+' 個不同負重），再多加幾跳'); return; }
        DB.fvProfiles.push(state.fvDraft);
        state.fvDraft = null; saveDB(); render();
      }
      else if(act==='toggleTheme'){ DB.settings.theme = DB.settings.theme==='dark'?'light':'dark'; applyTheme(); saveDB(); render(); }
      else if(act==='toggleMode'){
        if(state.currentSession){ alert('請先完成或離開目前訓練，再切換健身房／居家模式'); return; }
        DB.settings.mode = DB.settings.mode==='home'?'gym':'home';
        applyMode(); saveDB(); render();
      }
      else if(act==='toggleDeload'){ state.currentSession.deload = !state.currentSession.deload; render(); }
      else if(act==='setEnergy'){
        state.currentSession.checkin = state.currentSession.checkin || {energy:null, soreness:null};
        state.currentSession.checkin.energy = Number(el.dataset.val);
        render();
      }
      else if(act==='setSoreness'){
        state.currentSession.checkin = state.currentSession.checkin || {energy:null, soreness:null};
        state.currentSession.checkin.soreness = Number(el.dataset.val);
        render();
      }
      else if(act==='logBW'){
        const raw = document.getElementById('bwInput').value;
        const r = sanitizeNumber(raw, {min:20, max:300, allowZero:false});
        if(!r.valid || r.value===null){ alert('請輸入體重：'+(r.reason||'不能空白')); return; }
        DB.bodyweight.push({date:todayISO(), weight:r.value}); saveDB(); render();
      }
      else if(act==='logBF'){
        const raw = document.getElementById('bfInput').value;
        const r = sanitizeNumber(raw, {min:3, max:60, allowZero:false});
        if(!r.valid || r.value===null){ alert('請輸入合理的體脂率（%）：'+(r.reason||'不能空白')); return; }
        DB.bodyComp.push({date:todayISO(), bodyFat:r.value}); saveDB(); render();
      }
      else if(act==='saveStandingReach'){
        const v = Number(document.getElementById('standingReachInput').value);
        if(!v){ alert('請輸入站立摸高高度'); return; }
        DB.settings.standingReach = v; saveDB(); render();
      }
      else if(act==='logJumpTest'){
        const standing = Number(document.getElementById('jtStanding').value);
        const approach = Number(document.getElementById('jtApproach').value);
        if(!standing || !approach){ alert('原地跳跟助跑跳的高度都要填'); return; }
        DB.jumpTests.push({date:todayISO(), standing, approach}); saveDB(); render();
      }
      else if(act==='exportData'){ document.getElementById('exportBox').value = JSON.stringify(DB, null, 2); }
      else if(act==='importData'){
        try{
          const parsed = JSON.parse(document.getElementById('importBox').value);
          if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.sessions)){
            alert('Import failed：JSON 缺少必要的 sessions 欄位，資料未變更');
            return;
          }
          const before = JSON.stringify(DB);
          const rep = migrateDB(parsed);
          if(!rep.ok){ alert('Import failed：'+rep.error+'\n資料未變更'); return; }
          snapshotBeforeMigration(before, DB.schemaVersion||0);   // 覆蓋前先備份目前資料
          DB = rep.db || parsed; saveDB(); applyTheme(); applyMode(); render();
          alert('匯入完成（資料版本 v'+DB.schemaVersion+'）');
        }
        catch(err){ alert('JSON 格式錯誤，匯入失敗，資料未變更'); }
      }
      else if(act==='toggleTrend'){ state.openTrend = state.openTrend===el.dataset.name ? null : el.dataset.name; render(); }
      else if(act==='toggleTier3'){ state.tier3Open = !state.tier3Open; render(); }
      else if(act==='restoreBackup'){
        listBackups().then(keys=>{
          if(!keys.length){ alert('目前沒有任何自動備份。\n備份只會在資料版本升級或匯入時產生。'); return; }
          const key = keys[0];
          const stamp = new Date(Number(key.split('-').pop())).toLocaleString();
          if(!confirm('要還原這份備份嗎？\n\n備份時間：'+stamp+'\n\n目前的資料會先另存一份快照，再被這份備份取代。')) return;
          window.storage.get(key).then(r=>{
            if(!r || !r.value){ alert('備份讀取失敗，資料未變更'); return; }
            let parsed;
            try{ parsed = JSON.parse(r.value); }catch(e){ alert('備份內容損毀，資料未變更'); return; }
            const rep = migrateDB(parsed);
            if(!rep.ok){ alert('備份無法還原：'+rep.error+'\n資料未變更'); return; }
            snapshotBeforeMigration(JSON.stringify(DB), DB.schemaVersion||0);
            DB = rep.db || parsed; saveDB(); applyTheme(); applyMode(); render();
            alert('已還原（資料版本 v'+DB.schemaVersion+'）');
          });
        });
      }
      else if(act==='resetData'){
        if(confirm('確定要清除所有訓練紀錄嗎？此動作無法復原。')){
          DB = {schemaVersion:CURRENT_SCHEMA, sessions:[], notes:[], bodyweight:[], bodyComp:[], jumpTests:[], motionTests:[], jumpMeasurements:[], fvProfiles:[], settings:DB.settings, meta:DB.meta||{}};
          saveDB(); render();
        }
      }
    };
  });
  document.querySelectorAll('[data-setfield]').forEach(el=>{
    el.oninput = ()=>{
      const si = Number(el.dataset.si);
      const field = el.dataset.setfield;
      const ex = state.currentSession.exercises[state.exIndex];
      ex.sets[si][field] = el.value===''?null:Number(el.value);
    };
  });
  const bfDate = document.getElementById('backfillDate');
  if(bfDate) bfDate.onchange = ()=>{ state.currentSession.date = bfDate.value; };
  const sleepInput = document.getElementById('sleepHoursInput');
  if(sleepInput) sleepInput.oninput = ()=>{
    // 跟 sleep 一樣不即時 render()（保留輸入焦點），但要先寫進 state，
    // 這樣之後點精力/痠痛觸發的重繪，readinessNote() 才能看到剛剛打的睡眠時數。
    const v = Number(sleepInput.value);
    state.currentSession.checkin = state.currentSession.checkin || {energy:null, soreness:null, sleepHours:null};
    state.currentSession.checkin.sleepHours = (sleepInput.value!=='' && !isNaN(v)) ? v : null;
  };
  document.querySelectorAll('.navitem').forEach(el=>{
    el.onclick = ()=>{
      const nav = el.dataset.nav;
      if(nav==='workout' && state.currentSession){ state.screen='today'; }
      else { state.screen = nav; }
      render();
    };
  });
}



function startRestTimer(seconds){
  state.timerLeft = seconds;
  state.timerTotal = seconds;
  const C = 2*Math.PI*108;
  const overlay = document.createElement('div');
  overlay.className = 'timer-overlay';
  overlay.id = 'timerOverlay';
  overlay.innerHTML = `
    <div class="ring-wrap">
      <svg viewBox="0 0 238 238" width="238" height="238">
        <circle class="ring-bg" cx="119" cy="119" r="108"/>
        <circle class="ring-fg" id="ringFg" cx="119" cy="119" r="108"
          stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-mid">
        <div class="label">休息</div>
        <div class="timer-num" id="timerNum">${fmtTime(state.timerLeft)}</div>
      </div>
    </div>
    <div class="timer-controls">
      <button class="timer-btn" id="tMinus">−30s</button>
      <button class="timer-btn" id="tSkip">跳過</button>
      <button class="timer-btn" id="tPlus">+30s</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('tMinus').onclick = ()=>{ state.timerLeft=Math.max(0,state.timerLeft-30); updateTimerDisplay(); };
  document.getElementById('tPlus').onclick = ()=>{ state.timerLeft+=30; state.timerTotal=Math.max(state.timerTotal,state.timerLeft); updateTimerDisplay(); };
  document.getElementById('tSkip').onclick = closeTimer;
  state.timerInterval = setInterval(()=>{
    state.timerLeft--;
    if(state.timerLeft<=0){ closeTimer(); if(navigator.vibrate) navigator.vibrate(200); return; }
    updateTimerDisplay();
  },1000);
}
function updateTimerDisplay(){
  const n=document.getElementById('timerNum'); if(n) n.textContent = fmtTime(state.timerLeft);
  const r=document.getElementById('ringFg');
  if(r && state.timerTotal){
    const C = 2*Math.PI*108;
    const gone = 1 - Math.max(0, Math.min(1, state.timerLeft/state.timerTotal));
    r.setAttribute('stroke-dashoffset', (C*gone).toFixed(1));
  }
}
function fmtTime(s){ const m=Math.floor(s/60), sec=s%60; return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec; }
function closeTimer(){ clearInterval(state.timerInterval); const o=document.getElementById('timerOverlay'); if(o) o.remove(); }

loadDB().then(ok=>{ if(ok) render(); });
</script>
</body>
</html>
