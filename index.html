<style>
/* ============================================================
   VISUAL LANGUAGE — "ALTITUDE"
   這份課表的目標是跳得更高，所以整套視覺語言只講一件事：高度。
   ‧ 進度一律「由下往上長」（Rise Meter），不是由左往右的進度條
   ‧ 主色是粉筆記號的琥珀色 —— 你在牆上留下的最高點
   ‧ 大數字用 SF Pro Rounded，資料標籤用等寬字，內文用系統字
   每一頁有自己的節奏，不共用同一種卡片。
   ============================================================ */
:root{
  --void:#0F1114; --riser:#171A20; --raise:#1F242D;
  --chalk:#F4F5F2; --dust:#878D97; --faint:#868C96;
  --line:rgba(244,245,242,.10); --line2:rgba(244,245,242,.055);
  --mark:#FFB020; --mark-soft:rgba(255,176,32,.13); --mark-line:rgba(255,176,32,.42);
  --good:#4ADE9B; --danger:#FF6B5A;
  --glass:rgba(23,26,32,.72);
  --e:cubic-bezier(.22,1,.36,1);
  --micro:140ms; --ui:260ms; --major:420ms;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans CJK TC",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans CJK TC",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
[data-theme="light"]{
  --void:#EBEBE6; --riser:#F7F7F3; --raise:#FFFFFF;
  --chalk:#12141A; --dust:#666C76; --faint:#5E646E;
  --line:rgba(18,20,26,.11); --line2:rgba(18,20,26,.06);
  --mark:#B36A00; --mark-soft:rgba(179,106,0,.10); --mark-line:rgba(179,106,0,.35);
  --glass:rgba(247,247,243,.78);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none;}
input, textarea, [contenteditable="true"]{
  -webkit-user-select:text; user-select:text;}
html,body{margin:0; padding:0;}
body{
  font-family:var(--sans); background:var(--void); color:var(--chalk);
  font-size:15px; line-height:1.5; min-height:100vh;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
/* 背景的極淡高度暈染：越上面越亮，暗示「往上」 */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(120% 60% at 50% -10%, var(--mark-soft) 0%, transparent 62%);
  opacity:.85;
}
.wrap{position:relative; z-index:1; max-width:520px; margin:0 auto; padding:0 20px;
  padding-top:env(safe-area-inset-top);}
#app.enter{animation:enter var(--ui) var(--e);}
@keyframes enter{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

/* ---------- 字級系統 ---------- */
.figure{font-family:var(--rounded); font-weight:800; letter-spacing:-.035em; font-variant-numeric:tabular-nums; line-height:.92;}
.f-mega{font-size:clamp(56px,17vw,76px);}
.f-big{font-size:38px;}
.f-mid{font-size:26px;}
.label{font-family:var(--sans); font-size:11px; letter-spacing:.01em; font-weight:600; color:var(--dust);}
.label-mark{color:var(--mark);}
h1{font-family:var(--rounded); font-size:27px; font-weight:800; letter-spacing:-.02em; margin:0 0 2px;}
h2{font-size:16px; font-weight:700; margin:0 0 6px;}
h3{font-family:var(--sans); font-size:12.5px; letter-spacing:.01em;
   color:var(--dust); font-weight:700; margin:26px 0 10px;}
p{margin:4px 0;}
.muted{color:var(--dust); font-size:13px;}
.en{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; color:var(--faint); text-transform:uppercase;}

/* ---------- HOME：Hero + Flow ---------- */
.hero{margin:0 -20px; padding:34px 20px 26px; position:relative; overflow:hidden;}
.hero-grid{display:grid; grid-template-columns:14px 1fr; gap:18px; align-items:end;}
.hero-day{font-family:var(--rounded); font-weight:800; letter-spacing:-.008em; line-height:1.12;
  font-size:clamp(34px,10vw,48px); margin:8px 0 0;}
.hero-sub{display:flex; gap:14px; align-items:baseline; margin-top:12px;}
.hero-stat{display:flex; align-items:baseline; gap:5px;}
.hero-stat b{font-family:var(--rounded); font-size:18px; font-weight:800; letter-spacing:-.02em;}

/* Rise Meter —— 全 App 的簽名元素：進度永遠由下往上長 */
.meter{position:relative; width:14px; border-radius:8px; background:var(--line2);
  overflow:hidden; align-self:stretch; min-height:96px;}
.meter-fill{position:absolute; left:0; right:0; bottom:0;
  background:linear-gradient(180deg, var(--mark) 0%, var(--mark-line) 100%);
  border-radius:8px; transition:height var(--major) var(--e);}
.meter-tick{position:absolute; left:0; right:0; height:1px; background:var(--line);}

.flow{display:flex; gap:9px; overflow-x:auto; margin:0 -20px; padding:2px 20px 6px;
  scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;}
.flow::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto; scroll-snap-align:start; padding:11px 15px; border-radius:14px;
  background:var(--riser); border:1px solid var(--line2); min-width:104px;}
.chip b{display:block; font-family:var(--rounded); font-size:21px; font-weight:800; letter-spacing:-.02em; margin-top:3px;}

.week{display:flex; gap:6px; margin-top:4px;}
.week i{flex:1; height:30px; border-radius:7px; background:var(--line2); position:relative; font-style:normal;}
.week i.on{background:var(--mark);}
.week i.today{box-shadow:inset 0 0 0 1.5px var(--mark-line);}
.week-lab{display:flex; gap:6px; margin-top:5px;}
.week-lab span{flex:1; text-align:center; font-family:var(--mono); font-size:8.5px; color:var(--faint);}

/* ---------- WORKOUT：Focus / 垂直階梯 ---------- */
.ladder{position:relative; margin-top:6px; padding-left:34px;}
.ladder::before{content:''; position:absolute; left:12px; top:6px; bottom:6px; width:2px;
  background:var(--line2); border-radius:2px;}
.ladder-fill{position:absolute; left:12px; bottom:6px; width:2px; border-radius:2px;
  background:var(--mark); transition:height var(--major) var(--e);}
.rung{position:relative; display:flex; align-items:center; gap:12px; padding:13px 0;
  border-bottom:1px solid var(--line2); cursor:pointer;
  transition:opacity var(--ui) var(--e), transform var(--micro) var(--e);}
.rung:last-child{border-bottom:none;}
.rung:active{transform:scale(.99);}
.rung.done{opacity:.4;}
.rung .node{position:absolute; left:-28px; width:14px; height:14px; border-radius:50%;
  background:var(--void); border:2px solid var(--line); display:flex; align-items:center;
  justify-content:center; font-size:8px; font-weight:800;}
.rung.done .node{background:var(--mark); border-color:var(--mark); color:var(--void);}
.rung.now .node{border-color:var(--mark); box-shadow:0 0 0 4px var(--mark-soft);}
.rung.now{margin:0 -14px; padding:13px 14px; border-radius:14px; background:var(--riser); border-bottom:none;}
.rung-name{font-weight:700; font-size:15.5px; letter-spacing:-.01em;}
.rung-meta{font-family:var(--sans); font-size:12px; color:var(--dust); letter-spacing:0; margin-top:2px; font-variant-numeric:tabular-nums;}
.rung-count{font-family:var(--rounded); font-weight:800; font-size:15px; color:var(--dust); letter-spacing:-.02em;}
.rung.done .rung-count, .rung.now .rung-count{color:var(--mark);}

/* ---------- SET：完成後收合，只有目前這組是主角 ---------- */
.setstack{margin-top:10px;}
.slab{border-radius:16px; background:var(--riser); border:1px solid var(--line2);
  padding:14px; margin-bottom:8px; transition:background var(--ui) var(--e), border-color var(--ui) var(--e), box-shadow var(--ui) var(--e), padding var(--ui) var(--e), margin var(--ui) var(--e), border-radius var(--ui) var(--e);}
.slab.now{background:var(--raise); border-color:var(--mark-line); box-shadow:0 8px 26px rgba(0,0,0,.22);}
.slab.done{background:transparent; border-color:transparent; border-bottom:1px solid var(--line2);
  border-radius:0; padding:11px 4px; margin-bottom:0; display:flex; align-items:center; gap:12px; cursor:pointer;}
.slab.done .idx{color:var(--mark);}
.slab-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
.idx{font-family:var(--mono); font-size:10px; letter-spacing:.2em; color:var(--faint);}
.done-val{font-family:var(--rounded); font-weight:800; font-size:16px; letter-spacing:-.02em; flex:1;}
.fields{display:grid; gap:9px; grid-template-columns:1fr 1fr 74px;}
.fields.nw{grid-template-columns:1fr 74px;}
.fields.time{grid-template-columns:1fr;}
.field{display:flex; flex-direction:column; gap:5px;}
.stepper{display:flex; align-items:stretch; gap:4px; min-height:44px;}
.stepper input{flex:1; min-width:0; text-align:center;}
.stepbtn{width:40px; min-height:44px; border-radius:11px; border:1px solid var(--line);
  background:transparent; font-size:18px; font-weight:700; color:var(--dust);
  flex-shrink:0; padding:0; cursor:pointer; transition:background var(--micro) var(--e), color var(--micro) var(--e), transform var(--micro) var(--e);}
.stepbtn:active{background:var(--mark-soft); color:var(--mark); transform:scale(.94);}
input[type=number],input[type=text],input[type=date],textarea{
  width:100%; border:1px solid var(--line); background:var(--void); color:var(--chalk);
  border-radius:11px; padding:11px 10px; font-size:16px; font-family:var(--rounded);
  font-weight:700; letter-spacing:-.01em; -webkit-appearance:none; appearance:none;
}
input:focus,textarea:focus{outline:none; border-color:var(--mark-line);}
:focus-visible{outline:2px solid var(--mark); outline-offset:2px; border-radius:4px;}
input:focus-visible,textarea:focus-visible{outline-offset:0;}
textarea{resize:vertical; min-height:76px; font-family:var(--sans); font-weight:400; font-size:15px;}
.check{
  width:100%; height:46px; border-radius:13px; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:19px; cursor:pointer;
  background:transparent; color:var(--faint); transition:background var(--micro) var(--e), border-color var(--micro) var(--e), color var(--micro) var(--e), transform var(--micro) var(--e);
}
.check.done{background:var(--mark); border-color:var(--mark); color:var(--void);}
.check:active{transform:scale(.94);}
@keyframes pop{0%{transform:scale(1);} 42%{transform:scale(1.09);} 100%{transform:scale(1);}}
.slab.just{animation:pop 320ms var(--e);}

/* ---------- HISTORY：時間軸 ---------- */
.tl{position:relative; padding-left:26px; margin-top:10px;}
.tl::before{content:''; position:absolute; left:5px; top:10px; bottom:10px; width:1px; background:var(--line);}
.tl-month{font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; color:var(--faint);
  text-transform:uppercase; margin:22px 0 8px -26px;}
.tl-item{position:relative; padding:13px 0; border-bottom:1px solid var(--line2); cursor:pointer;
  display:flex; align-items:center; gap:12px; transition:transform var(--micro) var(--e);}
.tl-item:active{transform:translateX(2px);}
.tl-item::before{content:''; position:absolute; left:-25px; top:22px; width:9px; height:9px;
  border-radius:50%; background:var(--void); border:2px solid var(--mark-line);}
.tl-date{font-family:var(--rounded); font-weight:800; font-size:15px; letter-spacing:-.02em;
  min-width:44px; color:var(--dust);}
.tl-body{flex:1; min-width:0;}
.tl-name{font-weight:700; font-size:15px; letter-spacing:-.01em;}
.tl-meta{font-family:var(--sans); font-size:11.5px; color:var(--dust); letter-spacing:0; margin-top:2px; font-variant-numeric:tabular-nums;}

/* ---------- PROGRESS：資料視覺化 ---------- */
.plot{margin:0 -20px 2px; padding:0; position:relative;}
.plot svg{display:block; width:100%;}
.trend{padding:20px 0 16px; border-bottom:1px solid var(--line2);}
.trend-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
.delta{font-family:var(--mono); font-size:10px; letter-spacing:.1em; padding:3px 7px;
  border-radius:6px; background:var(--mark-soft); color:var(--mark);}
.delta.flat{background:var(--line2); color:var(--faint);}
.readout{display:flex; gap:22px; margin-top:14px;}
.readout div{display:flex; flex-direction:column; gap:3px;}
.readout b{font-family:var(--rounded); font-size:23px; font-weight:800; letter-spacing:-.025em;}

/* ---------- PR / 成就 ---------- */
.pr{position:relative; margin:0 -20px; padding:26px 20px; overflow:hidden;
  background:linear-gradient(160deg, var(--mark-soft), transparent 70%);}
.pr-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  padding:9px 0; border-bottom:1px solid var(--line2);}
.pr-row:last-child{border-bottom:none;}
@keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
.pr-row{animation:rise var(--major) var(--e) backwards;}
.pr-row:nth-child(2){animation-delay:70ms;} .pr-row:nth-child(3){animation-delay:140ms;}

/* ---------- 設定：極簡工具列，刻意不用卡片 ---------- */
.util{border-top:1px solid var(--line2);}
.util-row{display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:15px 0; border-bottom:1px solid var(--line2); font-size:15px;}
.util-row .k{color:var(--dust); font-size:14px;}
.toggle{position:relative; width:46px; height:27px; border-radius:14px; background:var(--line);
  cursor:pointer; flex-shrink:0; transition:background var(--micro) var(--e);}
.toggle.on{background:var(--mark);}
.toggle::after{content:''; position:absolute; top:2.5px; left:2.5px; width:22px; height:22px;
  border-radius:50%; background:#fff; transition:left var(--ui) var(--e);}
.toggle.on::after{left:21px;}

/* ---------- 共用元件 ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--line); background:transparent; color:var(--chalk);
  border-radius:14px; padding:15px 18px; font-size:15.5px; font-weight:700;
  font-family:var(--sans); letter-spacing:-.01em; cursor:pointer; width:100%;
  -webkit-appearance:none; appearance:none; transition:transform var(--micro) var(--e), opacity var(--micro);}
.btn:active{transform:scale(.985); opacity:.9;}
.btn-primary{background:var(--mark); color:#0F1114; border-color:var(--mark); font-weight:800;}
.btn-sm{padding:10px 14px; font-size:13.5px; width:auto; border-radius:11px;}
.btn-danger{color:var(--danger); border-color:var(--danger);}
.tag{display:inline-block; padding:4px 9px; border-radius:8px; font-family:var(--rounded);
  font-size:11px; font-weight:700; letter-spacing:0;}
.tag-mark{background:var(--mark-soft); color:var(--mark);}
.tag-mid{background:var(--line2); color:var(--faint);}
.note{background:var(--riser); border-left:2px solid var(--mark); border-radius:0 12px 12px 0;
  padding:12px 14px; margin:10px 0;}
.card{background:var(--riser); border-radius:14px; padding:16px; margin:0 0 14px;}
.card .plot{margin:0 0 2px;}
.empty{padding:44px 0 30px; text-align:center;}
.empty .figure{color:var(--line); font-size:52px;}
.divider{height:1px; background:var(--line2); margin:14px 0;}
.topbar{display:flex; align-items:center; gap:12px; padding-top:22px; margin-bottom:14px;}
.back{width:44px; height:44px; border-radius:50%; border:1px solid var(--line); display:flex;
  align-items:center; justify-content:center; font-size:19px; color:var(--dust); cursor:pointer;
  flex-shrink:0; transition:transform var(--micro) var(--e); margin-left:-4px;}
.back:active{transform:scale(.9);}
.pad{padding-top:26px;}
.toast{position:fixed; bottom:calc(92px + env(safe-area-inset-bottom)); left:50%;
  transform:translateX(-50%) translateY(8px); background:var(--chalk); color:var(--void);
  padding:9px 17px; border-radius:20px; font-size:13px; font-weight:700; z-index:80;
  opacity:0; transition:opacity var(--ui), transform var(--ui) var(--e); pointer-events:none; white-space:nowrap;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- 浮動導覽 ---------- */
.navbar{position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom)); display:flex; gap:2px; z-index:50;
  background:var(--glass); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  border:1px solid var(--line); border-radius:22px; padding:6px;
  box-shadow:0 10px 34px rgba(0,0,0,.28); transition:opacity var(--ui) var(--e);}
.navbar.dim{opacity:0; pointer-events:none;}
.navitem{display:flex; flex-direction:column; align-items:center; gap:3px; width:60px;
  padding:8px 0 7px; cursor:pointer; color:var(--faint); border-radius:16px;
  font-family:var(--mono); font-size:8.5px; letter-spacing:.08em;
  transition:color var(--micro) var(--e), background var(--micro) var(--e);}
.navitem.active{color:var(--mark); background:var(--mark-soft);}
.navicon{width:19px; height:19px; display:block;}

/* ---------- 休息計時：環形 ---------- */
.timer-overlay{position:fixed; inset:0; z-index:100; display:flex; flex-direction:column;
  align-items:center; justify-content:center; background:var(--void);
  animation:fadein var(--ui) var(--e);}
@keyframes fadein{from{opacity:0;} to{opacity:1;}}
.ring-wrap{position:relative; width:238px; height:238px;}
.ring-wrap svg{transform:rotate(-90deg); display:block;}
.ring-bg{fill:none; stroke:var(--line2); stroke-width:5;}
.ring-fg{fill:none; stroke:var(--mark); stroke-width:5; stroke-linecap:round;
  transition:stroke-dashoffset 1s linear;}
.ring-mid{position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:5px;}
.timer-num{font-family:var(--rounded); font-size:60px; font-weight:800; letter-spacing:-.04em;
  font-variant-numeric:tabular-nums; line-height:1;}
.timer-controls{display:flex; gap:10px; margin-top:34px;}
.timer-btn{padding:12px 20px; border-radius:14px; border:1px solid var(--line);
  background:transparent; color:var(--chalk); font-family:var(--mono); font-size:11px;
  letter-spacing:.1em; cursor:pointer; transition:transform var(--micro) var(--e);}
.timer-btn:active{transform:scale(.94);}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important;}
}
</style>
</head>

<div class="wrap" id="app"></div>

<div class="navbar">
  <div class="navitem" data-nav="home" role="button" aria-label="首頁"><svg class="navicon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>HOME</div>

<script>
function g(n,sets,reps,rir,rest,weighted,type,extra){ return Object.assign({n,sets,reps,rir,rest,weighted,type},extra||{}); }
const HOME_DIFF = "難度不夠時依序：加次數→放慢節奏→加停頓→加大動作範圍→改單邊→縮短休息";

// 器材沒有／維修中的替代動作——直接用 PDF「健身房→居家動作對照表」的對應關係，
// 不自己發明替代動作。大部分替代動作剛好就是居家版本身已經定義好的動作，直接沿用，
// 不用另外重寫一份。次數怎麼調整也是照 PDF 表訂的比例，不是自己估的。
const GYM_SUBSTITUTE = {
  "Back Squat": {sub:"Bulgarian Split Squat", note:"5下 → 12–20下"},
  "Trap-bar Deadlift": {sub:"DB Deadlift", note:"5下 → 12–15下"},
  "RDL": {sub:"Single-leg RDL", note:"8下 → 10下/邊"},
  "Hip Thrust": {sub:"Single-leg Hip Thrust", note:"10下 → 15下/邊"},
  "Leg Press": {sub:"Reverse Lunge", note:"12下 → 12下/邊"},
  "Leg Curl": {sub:"Sliding Leg Curl", note:"10下 → 10–12下"},
  "Bench Press": {sub:"DB Floor Press", note:"5下 → 10–12下"},
  "Incline DB Press": {sub:"Feet-elevated Push-up", note:"10下 → 力竭前1下"},
  "Chest-Supported Row": {sub:"One-arm DB Row", note:"12下 → 12–15下"},
  "Lat Pulldown": {sub:"Pull-up 或 Inverted Row", note:"15下 → 15下（用彈力帶輔助）"},
  "Standing OHP": {sub:"DB Shoulder Press", note:"6下 → 8–12下"},
  "Face Pull": {sub:"Reverse Fly", note:"15下 → 18下"},
  "Overhead Extension": {sub:"Bench Dip", note:"12下 → 15下"},
  "Standing Calf Raise": {sub:"Single-leg Calf Raise", note:"10下 → 15–20下/邊"},
  "Seated Calf Raise": {sub:"Seated Calf Raise（腿壓啞鈴）", note:"12下 → 20下"},
  // 這6項是Kenny發現原本沒有替代動作的缺口，補上真的存在於課表裡的動作當替代，
  // 不是憑空發明新動作——優先找同肌群、器材需求更低的既有動作。
  "Bulgarian Split Squat": {sub:"Reverse Lunge", note:"10下/邊 → 12下/邊（沒有長凳可放後腳時用）"},
  "Seated DB Press": {sub:"DB Shoulder Press", note:"10下 → 8下（沒有椅子時，站姿做）"},
  "Cable Row": {sub:"Chest-Supported Row", note:"12下 → 12下（沒有繩索機時，用啞鈴代替）"},
  "Incline DB Curl": {sub:"Hammer Curl", note:"10下 → 12下（沒有斜板椅時）"},
  "Hammer Curl": {sub:"Incline DB Curl", note:"12下 → 10下（想換個角度刺激時）"},
  "Rope Pushdown": {sub:"Overhead Extension", note:"15下 → 12下（沒有繩索機時）"}
};

// 找替代動作的定義——不限同一天，因為替代動作本質上是同一個動作，換到哪天都是同一個定義。
// Day5選配日沒有專屬居家版本，Face Pull的替代（Reverse Fly）要從Day4才找得到，
// 限制在同一天找的話會漏掉這種情況。同時也要搜PROGRAM_GYM——有些替代動作本身就是健身房版
// 的另一個動作（例如Cable Row換成Chest-Supported Row），不是只有居家版能當替代對象。
function findSubstituteDef(name){
  for(const day of Object.keys(PROGRAM_HOME)){
    const found = PROGRAM_HOME[day].exercises.find(e=>e.n===name);
    if(found) return found;
  }
  for(const day of Object.keys(PROGRAM_GYM)){
    const found = PROGRAM_GYM[day].exercises.find(e=>e.n===name);
    if(found) return found;
  }
  return null;
}

const WARMUP_GYM = {
  1: "腳踏車 3 分鐘 → 弓箭步伸展 / 腿後擺盪 / 深蹲抱膝 / 腳踝前推，各 8 下 → 臀橋 15 下 → 側走彈力帶 10 步/邊",
  2: "滑輪繩索臉拉 15 下 × 2 → 肩繞環 10 圈 → 臥推空槓 10 下",
  3: "同 Day 1",
  4: "滑輪下拉輕重量 15 下 × 2 → 臉拉 15 下 → 肩繞環",
  5: "想練再練，累就跳過。全部動作都可以做到快力竭，不做下半身、不做任何跳躍"
};

const PROGRAM_GYM = {
  1: {name:"Day 1 — 下半身A", exercises:[
    g("Pogo Jump",3,"10","—",60,false,"reps",{cue:"膝蓋幾乎不彎，只用腳踝彈。像彈簧一樣，腳一碰地立刻彈起來"}),
    g("2步助跑跳",5,"3","—",90,false,"reps",{cue:"只跑最後兩步，速度用 7 成。手沾粉筆灰摸牆。看到高度掉就停止整個動作"}),
    g("Back Squat",4,"5",2,210,true,"reps",{main:true,inc:5,cue:"蹲到大腿與地面平行或再低一點"}),
    g("Bulgarian Split Squat",3,"10/邊",2,120,true,"reps",{cue:"後腳放長凳。前腳踩穩，身體微前傾"}),
    g("RDL",3,"8",2,120,true,"reps",{main:true,inc:5,cue:"膝蓋微彎不動，屁股往後推，感覺大腿後側被拉開"}),
    g("Standing Calf Raise",4,"10",1,90,true,"reps",{cue:"最高點停 1 秒，最低點腳跟完全放下去"}),
    g("Spanish Squat",3,"30秒","—",60,false,"time",{cue:"彈力帶繞膝蓋後方固定，半蹲撐住不動。保護膝蓋肌腱用的，不要跳過"})
  ]},
  2: {name:"Day 2 — 上半身A", exercises:[
    g("Bench Press",4,"5",2,180,true,"reps",{main:true,inc:2.5,cue:"槓碰胸再推。熱身組：空槓10 → 40kg 5 → 50kg 3 → 57.5kg 1"}),
    g("Pull-up",4,"6","1–2",150,false,"reps",{cue:"選一條彈力帶讓你剛好能做 6 下且還剩 1 下。胸口靠近槓，下放到手臂完全打直"}),
    g("Incline DB Press",3,"10",1,120,true,"reps",{cue:"椅背 30 度"}),
    g("Chest-Supported Row",3,"12",1,120,true,"reps",{cue:"胸靠著墊子，肩胛骨用力夾"}),
    g("Seated DB Press",3,"10","1–2",120,true,"reps"),
    g("Lateral Raise",3,"15","0–1",90,true,"reps",{cue:"手肘微彎，抬到與肩同高。可以做到快力竭。這是肩寬最有效的動作"}),
    g("Overhead Extension",3,"12",1,90,true,"reps",{cue:"滑輪或啞鈴都行。可以做到快力竭"})
  ]},
  3: {name:"Day 3 — 下半身B", exercises:[
    g("CMJ",5,"3","—",120,false,"reps",{cue:"全力向上，用力擺臂。每一下都當作最後一下在跳"}),
    g("Lateral Bound",3,"4/邊","—",120,false,"reps",{cue:"單腳往側邊跳出去，另一腳落地後撐住 1 秒站穩再跳回來"}),
    g("Trap-bar Deadlift",4,"5",2,180,true,"reps",{main:true,inc:5,cue:"背打直，用腿推地板。向上要快"}),
    g("Hip Thrust",3,"10","1–2",120,true,"reps",{main:true,inc:5,cue:"最高點屁股夾緊停 1 秒"}),
    g("Leg Press",3,"12",1,120,true,"reps",{cue:"膝蓋不要完全打直鎖死"}),
    g("Leg Curl",3,"10",1,90,true,"reps",{cue:"放下去用 3 秒慢慢控制。這是預防拉傷最重要的動作"}),
    g("Seated Calf Raise",3,"12",1,90,true,"reps",{cue:"坐姿練的肌肉和站姿不一樣，兩個都要"})
  ]},
  4: {name:"Day 4 — 上半身B", exercises:[
    g("Pull-up Cluster",5,"3",2,120,false,"reps",{cue:"只做 3 下就停，不要做到力竭。每一下都要標準：胸口靠近槓、下放到手臂完全直"}),
    g("Standing OHP",4,"6",2,150,true,"reps",{main:true,inc:2.5,cue:"核心收緊不要挺腰"}),
    g("Cable Row",3,"12",1,120,true,"reps",{cue:"拉到腹部，肩胛夾緊停 1 秒"}),
    g("Lat Pulldown",3,"15","0–1",90,true,"reps",{cue:"寬握。這是練背寬（V型）的主力。可以做到快力竭"}),
    g("Face Pull",3,"15","0–1",60,true,"reps",{cue:"拉到臉前，手肘打開。護肩用"}),
    g("Lateral Raise",3,"15","0–1",60,true,"reps",{cue:"一週練兩次是故意的。可以做到快力竭"}),
    g("Incline DB Curl",3,"10",1,90,true,"reps",{cue:"椅背 45 度，手肘在身後"}),
    g("Pallof Press",2,"8–10/邊",1,60,true,"reps",{cue:"滑輪或彈力帶側身站立，雙手推出再收回，過程中軀幹不能被拉轉"})
  ]},
  5: {name:"Day 5 — 選配", exercises:[
    g("Lateral Raise",3,"18","0–1",60,true,"reps"),
    g("Face Pull",3,"18","0–1",60,true,"reps"),
    g("Fly",3,"15","0–1",90,true,"reps",{cue:"啞鈴或滑輪都行"}),
    g("Hammer Curl",3,"12","0–1",60,true,"reps"),
    g("Rope Pushdown",3,"15","0–1",60,true,"reps")
  ]}
};

const WARMUP_HOME = {
  1: "開合跳 2 分鐘 → 弓箭步伸展 / 腿後擺盪 / 深蹲抱膝 各 8 下 → 臀橋 15 下",
  2: "手臂繞環 20 圈 → 伏地挺身 10 下（輕鬆的）→ 肩胛前後推 10 下",
  3: "同 Home Day 1",
  4: "手臂繞環 → 彈力帶或空手划船 15 下 × 2"
};

const PROGRAM_HOME = {
  1: {name:"Day 1 — 下半身A（居家）", exercises:[

// 目前第幾週：從第一筆訓練紀錄的日期起算，純粹依據你自己的實際訓練歷史計算，
// 不需要另外設定「開始日」，也不會因為缺練而暫停或跳週——就是單純的日曆週數。
function programWeekInfo(){
  if(!DB.sessions.length) return {week:1, block:JUMP_PROGRESSION[0], startDate:null};
  const firstDate = DB.sessions.map(s=>s.date).sort()[0];
  const [y,m,d] = firstDate.split('-').map(Number);
  const start = new Date(y, m-1, d);
  const [ty,tm,td] = todayISO().split('-').map(Number);
  const today = new Date(ty, tm-1, td);
  const diffDays = Math.round((today - start) / 86400000);
  const week = Math.min(Math.max(Math.floor(diffDays/7) + 1, 1), 12);
  const block = JUMP_PROGRESSION.find(b => week>=b.weeks[0] && week<=b.weeks[1]) || JUMP_PROGRESSION[JUMP_PROGRESSION.length-1];
  return {week, block, startDate:firstDate};
}

// 摸高測試——PDF 第9頁明講「這是這份計畫成不成功的關鍵指標」：原地跳摸高 vs 助跑跳摸高的差距，
// 目標從負的變成 +5cm 以上。純附加資料，跟訓練 session 完全分開記錄。
function jumpGap(j){ return Math.round((j.approach - j.standing)*10)/10; }

// ============================================================
// 垂直跳測量——My Jump 2 匯入（取代手機加速度計版本）
// 加速度計法誤差量級（Mascia et al. 2023：16–18cm）跟攝影機/飛行時間法（My Jump 2，
// 誤差通常在1cm以內）差了30–50倍，不是同一種精準度的資料，所以整個換掉，不是加個選項。
// RAW（使用者匯入或手動輸入的原始值）跟 DERIVED（App 自己用飛行時間反推的高度）分開存，
// 兩者互相對照但不互相覆蓋——這條規則跟這份 App 一路的資料誠實原則一致。
// 高度公式 h(m) = t² × 1.22625（t=飛行時間秒）是 My Jump / My Jump 2 官方採用的 Bosco
// 公式，不是本 App 自行假設的算法。
// ============================================================
const JUMP_TYPES = {CMJ:'反向跳 CMJ', SJ:'蹲踞跳 SJ', DJ:'落地跳 DJ', CMJAS:'擺臂反向跳 CMJAS'};
const JUMP_MDC_REF_CM = 1.5; // 文獻參考值(SEM/SWC/MDC研究)，不是Kenny個人實測的MDC，只能當粗略參考

// A1/B6：日期解析只信 YYYY-MM-DD 這種無歧義格式，直接拆字串取值，不經過 new Date() 的
// 時區轉換（那個路徑對 "29/08/2026" 這種格式常常解析錯，對 UTC 邊界也會產生時區位移）。
// 其他格式一律回傳失敗，讓呼叫端自己決定要怎麼提示使用者，不要用 Date() 亂猜。
function parseInputDate(str){
  if(!str) return {ok:false, iso:null};
  const s = String(str).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m){
    const y=Number(m[1]), mo=Number(m[2]), da=Number(m[3]);
    if(mo>=1 && mo<=12 && da>=1 && da<=31) return {ok:true, iso: m[1]+'-'+m[2]+'-'+m[3]};
  }
  return {ok:false, iso:null};
}
function jumpDedupKey(e){
  return [e.date, e.type, e.raw.flightTimeMs, e.raw.heightCm, e.device].join('|');
}
function boscoHeightCm(flightTimeMs){
  if(flightTimeMs===null || flightTimeMs===undefined || isNaN(flightTimeMs) || flightTimeMs<=0) return null;
  const t = flightTimeMs/1000;
  return Math.round(t*t*1.22625*100*10)/10;
}

function detectJumpColumns(headerRow){
  const norm = s => (s||'').toString().toLowerCase();
  const find = (keywords)=> headerRow.findIndex(h=> keywords.some(k=> norm(h).indexOf(k)>=0));
  // B6：height 欄位優先找「jump height」，避免被 Body Height／Athlete Height 這種欄位搶走
  // （找到的話那筆資料的「身高」會被誤當成「跳躍高度」）。找不到明確的 jump height 才退回
  // 任何含 height 但不含 body/athlete/standing/person 的欄位。
  let heightIdx = find(['jump height','跳躍高度']);
  if(heightIdx===-1){
    heightIdx = headerRow.findIndex(h=>{
      const n = norm(h);
      return n.indexOf('height')>=0 && n.indexOf('body')<0 && n.indexOf('athlete')<0 && n.indexOf('standing')<0 && n.indexOf('person')<0;
    });
  }
  return {
    date: find(['date','日期']),
    type: find(['type','jump type','跳躍類型','test']),
    heightCm: heightIdx,
    flightTimeMs: find(['flight']),
    contactTimeMs: find(['contact']),
    rsi: find(['rsi']),
    power: find(['power']),
    velocity: find(['velocity']),
    force: find(['force'])
  };
}

function buildJumpEntry(vals){
  // vals：已經是解析／輸入後的原始值物件，不管來自 CSV 或手動輸入，走同一套驗證邏輯
  const num = v => (v===null || v===undefined || v==='' || isNaN(Number(v))) ? null : Number(v);
  const rawHeight = num(vals.heightCm);
  const rawFlight = num(vals.flightTimeMs);
  const rawContact = num(vals.contactTimeMs);
  const rawRsi = num(vals.rsi);
  const rawPower = num(vals.power);
  const rawVelocity = num(vals.velocity);
  const rawForce = num(vals.force);
  const flags = [];

  let date = todayISO();
  if(vals.date){
    const dp = parseInputDate(vals.date);
    if(dp.ok) date = dp.iso;
    else flags.push('日期「'+vals.date+'」格式無法辨識（只認 YYYY-MM-DD），暫用今天日期，請自行檢查');
  }

  let type = 'CMJ';
  if(vals.type){
    const t = vals.type.toString().toUpperCase();
    if(JUMP_TYPES[t]) type = t;
    else if(t.indexOf('DROP')>=0 || t.indexOf('DJ')>=0) type='DJ';
    else if(t.indexOf('SQUAT')>=0) type='SJ';
    else if(t.indexOf('CMJ')>=0 || t.indexOf('COUNTERMOVEMENT')>=0) type='CMJ';
    else flags.push('跳躍類型「'+vals.type+'」無法辨識，暫歸類為CMJ');
  }

  if(rawHeight===null && rawFlight===null) flags.push('沒有高度也沒有飛行時間，這筆資料無法使用');
  if(rawHeight!==null && (rawHeight<=0 || rawHeight>150)) flags.push('高度數值('+rawHeight+'cm)超出合理範圍，請確認單位');
  if(rawFlight!==null && rawFlight<50) flags.push('飛行時間('+rawFlight+')小於50，懷疑單位是秒不是毫秒');

  const derivedHeight = boscoHeightCm(rawFlight);
  if(rawHeight!==null && derivedHeight!==null){
    const diff = Math.abs(rawHeight - derivedHeight);
    if(diff > JUMP_MDC_REF_CM) flags.push('匯入高度('+rawHeight+'cm)與飛行時間反推高度('+derivedHeight+'cm)差距'+diff.toFixed(1)+'cm，超出測量誤差合理範圍，請檢查欄位或單位');
  }

  return {
    id: 'JM_'+date+'_'+Math.random().toString(36).slice(2,8),
    date, type, source: vals.source||'manual',
    device: vals.device || 'My Jump 2',
    familiarization: !!vals.familiarization,
    raw: {heightCm:rawHeight, flightTimeMs:rawFlight, contactTimeMs:rawContact, rsi:rawRsi, power:rawPower, velocity:rawVelocity, force:rawForce, sourceRow: vals.sourceRow||null},
    derived: {heightCm: derivedHeight},
    status: flags.length ? 'NEEDS_REVIEW' : 'OK',
    flags
  };
}

function jumpDisplayHeight(m){
  if(m.raw.heightCm!==null && m.raw.heightCm!==undefined) return {value:m.raw.heightCm, from:'匯入值'};
  if(m.derived.heightCm!==null) return {value:m.derived.heightCm, from:'由飛行時間反推'};
  return {value:null, from:null};
}

// B6：處理引號欄位（例如 "August 29, 2026" 裡面包了逗號，不能直接用 split(',') 切開），
// 逐字元掃描，遇到引號內的逗號不切。
function splitCsvLine(line, useTab){
  if(useTab) return line.split('\t').map(s=>s.trim());
  const result = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQuotes){
      if(c==='"'){
        if(line[i+1]==='"'){ cur+='"'; i++; } else { inQuotes=false; }
      } else cur += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ result.push(cur); cur=''; }
      else cur += c;
    }
  }
  result.push(cur);
  return result.map(s=>s.trim());
}
function parseJumpCsvText(text, opts){
  opts = opts || {};
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  if(lines.length<2) return {error:'至少需要一行標題列＋一行資料', entries:[]};
  // B6：整段文字只判斷一次是不是 Tab 分隔（用標題列判斷），不要每行各自判斷——
  // 不然標題列剛好沒有 Tab、資料列有 Tab 這種情況會切錯欄。Tab 優先於逗號判斷。
  const useTab = lines[0].indexOf('\t')>=0;
  const header = splitCsvLine(lines[0], useTab).map(h=>h.trim());
  const cols = detectJumpColumns(header);
  const entries = [];
  for(let i=1;i<lines.length;i++){
    const row = splitCsvLine(lines[i], useTab).map(c=>c.trim());
    const get = idx => (idx===-1 || idx===undefined) ? null : row[idx];
    entries.push(buildJumpEntry({
      date: get(cols.date), type: get(cols.type), heightCm: get(cols.heightCm),
      flightTimeMs: get(cols.flightTimeMs), contactTimeMs: get(cols.contactTimeMs),
      rsi: get(cols.rsi), power: get(cols.power), velocity: get(cols.velocity), force: get(cols.force),
      source: 'myjump2_import', sourceRow: row.join(' | '),
      device: opts.device || 'My Jump 2', familiarization: !!opts.familiarization
    }));
  }
  return {error:null, entries, detected:cols, header};
}


function rollingAverage(arr, window){
  return arr.map((_,i)=>{
    const start = Math.max(0, i-window+1);
    const slice = arr.slice(start, i+1);
    return Math.round(slice.reduce((a,b)=>a+b,0)/slice.length*10)/10;
  });
}
// PHASE 3：14/28天個人化baseline + Signal Quality，CMJ/SJ/DJ分開算(不同動作模式，
// 不能混在同一個基準裡)。Signal Quality純粹看樣本數(3以下=資料不足，4-5=偏低，6+=尚可)，
// 這是基本統計常識(樣本越多估計越穩)，不是套用什麼生理學門檻，樣本數本身就是誠實的判準。
function computeJumpTypeBaseline(type, windowDays){
  const [ty,tm,td] = todayISO().split('-').map(Number);
  const today = new Date(ty,tm-1,td);
  const vals = DB.jumpMeasurements
    .filter(m=>m.type===type && !m.familiarization && m.status==='OK')
    .map(m=>({date:m.date, v:jumpDisplayHeight(m).value}))
    .filter(m=>m.v!==null)
    .filter(m=>{
      const [y,mo,d] = m.date.split('-').map(Number);
      const days = (today - new Date(y,mo-1,d))/86400000;
      return days>=0 && days<=windowDays;
    })
    .map(m=>m.v);
  if(vals.length<3) return {ok:false, n:vals.length, windowDays, quality:'INSUFFICIENT_DATA'};
  const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(vals.length-1));
  const quality = vals.length>=6 ? 'MODERATE' : 'LOW';
  return {ok:true, n:vals.length, windowDays, mean:Math.round(mean*10)/10, sd:Math.round(sd*100)/100, quality};
}

function jumpTypeTrendCard(type){
  const label = JUMP_TYPES[type] || type;
  const all = DB.jumpMeasurements.filter(m=>m.type===type && !m.familiarization && m.status==='OK').sort((a,b)=>a.date<b.date?-1:1);
  if(all.length<2) return '';

  // 量測工具換過（例如以後不再用 My Jump 2），不同工具量出來的數字不是同一把尺，不能接在
  // 同一條趨勢線裡當作連續變化——只取「目前這個工具」最新一段連續的資料來畫圖，
  // 換工具之前的資料留在歷史紀錄裡，但不混進這張趨勢圖。
  let runStart = 0;
  for(let i=all.length-1;i>0;i--){ if(all[i].device !== all[i-1].device){ runStart = i; break; } }
  const currentRun = all.slice(runStart);
  const deviceChanged = runStart > 0;

  const heights = currentRun.map(m=>jumpDisplayHeight(m).value).filter(v=>v!==null);
  if(heights.length<2) return deviceChanged ? `<div class="card" style="margin:0 0 14px">
    <div class="label">垂直跳趨勢（${label}）</div>
    <p class="muted" style="font-size:12px">量測工具剛換過（目前：${currentRun[0]?currentRun[0].device:'—'}），還沒有累積到兩筆同一工具的資料，暫時畫不出趨勢</p>
  </div>` : '';

  const recent = heights.slice(-4);
  const recentAvg = recent.length ? Math.round(recent.reduce((a,b)=>a+b,0)/recent.length*10)/10 : null;
  const last = heights[heights.length-1];
  const b14 = computeJumpTypeBaseline(type, 14);
  const b28 = computeJumpTypeBaseline(type, 28);
  const qualityLabel = {INSUFFICIENT_DATA:'資料不足', LOW:'樣本偏少，僅供參考', MODERATE:'樣本尚可'};
  return `<div class="card" style="margin:0 0 14px">
    <div class="label">垂直跳趨勢（${label}・${currentRun[0].device}・淡點原始值／實線4次移動平均）</div>
    ${rollingSparkline(heights, 4)}
    <div class="muted" style="font-size:12px; margin-top:8px; line-height:1.6">
      淡點是每次原始數字，實線是4次移動平均——前3個點還沒滿4次，只畫淡點，不會假裝已經有平均線可看。
      最近一次原始值 ${last}cm，近4次平均 ${recentAvg}cm。
      文獻參考的測量誤差範圍約 ±${JUMP_MDC_REF_CM}cm（來自其他研究樣本，不是你個人的實測值，只能當「匯入高度跟反推高度差太多可能單位錯」的檢查用，不是你個人的MDC），
      差距在這個範圍內不能當作「真的進步」，只能說可能還在誤差範圍內。
      ${deviceChanged?'<br>量測工具換過，這張圖只算換工具之後的資料，之前的紀錄還在歷史清單裡，但沒有接進這條趨勢線。':''}
    </div>
    <div class="muted" style="font-size:11px; margin-top:8px; border-top:1px solid var(--line2); padding-top:8px">
      14天基準：${b14.ok?`${b14.mean}cm（${b14.n}筆・${qualityLabel[b14.quality]}）`:`${qualityLabel[b14.quality]}（${b14.n}筆）`}　
      28天基準：${b28.ok?`${b28.mean}cm（${b28.n}筆・${qualityLabel[b28.quality]}）`:`${qualityLabel[b28.quality]}（${b28.n}筆）`}
      <br>訊號品質偏低或資料不足時，這裡的數字只能當參考，不會拿去驅動任何 readiness 或 deload 判斷——目前這個App裡兩者本來就完全分開，沒有接在一起。
    </div>
  </div>`;
}

// ============================================================
// 力量-速度剖面（Force-Velocity Profile, Samozino's method）
// 現況：F0(理論最大力)、V0(理論最大速度)、Pmax、SFv 的精確計算公式（inverse dynamics，
// 需要體重、跳躍高度、推蹬距離三個變數的閉式方程式）我沒辦法從搜尋結果拿到完整、
// 沒被截斷的版本可以照抄——與其冒著算錯公式、把假數字當真結果給你看的風險，
// 這裡先只收集、只呈現原始資料（每次負重對應的跳躍高度），不算 F0/V0/Pmax。
// 等我確認到可靠的公式來源，再回來加這段計算。
// ============================================================
function fvBuildProfile(vals){
  const num = v => (v===null || v===undefined || v==='' || isNaN(Number(v))) ? null : Number(v);
  const bodyMassKg = num(vals.bodyMassKg);
  const pushOffCm = num(vals.pushOffCm);
  const flags = [];
  let date = todayISO();
  if(vals.date){ const dp = parseInputDate(vals.date); if(dp.ok) date = dp.iso; }
  if(bodyMassKg===null) flags.push('沒有填體重，之後要算F0/V0時會需要');
  if(pushOffCm===null) flags.push('沒有填推蹬距離(Hpo)，之後要算F0/V0時會需要');
  return {
    id: 'FV_'+date+'_'+Math.random().toString(36).slice(2,8),
    date, device: vals.device||'My Jump 2',
    bodyMassKg, pushOffCm, trials: [], flags
  };
}
function fvScatter(trials){
  if(trials.length<2) return '';
  const w=340, h=140, pad=24;
  const loads = trials.map(t=>t.loadKg);
  const heights = trials.map(t=>t.heightCm);
  const lMin=Math.min(...loads), lMax=Math.max(...loads)||1;
  const hMin=Math.min(...heights), hMax=Math.max(...heights)||1;
  const lRange=(lMax-lMin)||1, hRange=(hMax-hMin)||1;
  const pts = trials.map(t=>{
    const x = pad + ((t.loadKg-lMin)/lRange)*(w-pad*2);
    const y = h-pad - ((t.heightCm-hMin)/hRange)*(h-pad*2);
    return {x,y,t};
  });
  return `<div class="plot"><svg viewBox="0 0 ${w} ${h}" height="${h}" aria-hidden="true">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line2)" stroke-width="1"/>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="var(--line2)" stroke-width="1"/>
    ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="var(--mark)"/>`).join('')}
    <text x="${pad}" y="${h-8}" font-size="9" fill="var(--faint)">${lMin}kg</text>
    <text x="${w-pad}" y="${h-8}" font-size="9" fill="var(--faint)" text-anchor="end">${lMax}kg</text>
    <text x="${pad+4}" y="${h-4}" font-size="9" fill="var(--faint)">負重(kg)→</text>
    <text x="4" y="${h-pad}" font-size="9" fill="var(--faint)">${hMin}cm</text>
    <text x="4" y="${pad+8}" font-size="9" fill="var(--faint)">${hMax}cm</text>
  </svg></div>`;
}


function jumpTestSummary(){
  const tests = Array.isArray(DB.jumpTests) ? [...DB.jumpTests].sort((a,b)=> a.date<b.date?-1:1) : [];
  if(!tests.length) return null;
  const latest = tests[tests.length-1];
  const gaps = tests.map(jumpGap);
  const bestGap = Math.max(...gaps);
  const reach = (DB.settings && typeof DB.settings.standingReach==='number') ? DB.settings.standingReach : null;
  const heightOf = j => reach!==null ? Math.round((j.standing - reach)*10)/10 : null;
  return {
    latest, latestGap: jumpGap(latest), bestGap, trend: gaps, count: tests.length,
    reach,
    standingHeight: heightOf(latest),
    approachHeight: reach!==null ? Math.round((latest.approach - reach)*10)/10 : null
  };
}

function dbFingerprint(db){
  const sessions = Array.isArray(db.sessions) ? db.sessions : [];
  let setLogs=0, doneSets=0, volume=0, repsTotal=0;
  const dates=[];
  sessions.forEach(s=>{
    dates.push(s.date);
    (s.exercises||[]).forEach(ex=>{
      (ex.sets||[]).forEach(st=>{
        setLogs++;
        if(st.done){
          doneSets++;
          repsTotal += Number(st.reps)||0;
          volume += (Number(st.weight)||0)*(Number(st.reps)||0);
        }
      });
    });
  });
  dates.sort();
  return {
    sessionCount: sessions.length,
    setLogs, doneSets, repsTotal,
    volume: Math.round(volume*1000)/1000,
    bwCount: Array.isArray(db.bodyweight) ? db.bodyweight.length : 0,
    bwSum: Array.isArray(db.bodyweight) ? Math.round(db.bodyweight.reduce((a,b)=>a+(Number(b.weight)||0),0)*1000)/1000 : 0,
    bcCount: Array.isArray(db.bodyComp) ? db.bodyComp.length : 0,
    bcSum: Array.isArray(db.bodyComp) ? Math.round(db.bodyComp.reduce((a,b)=>a+(Number(b.bodyFat)||0),0)*1000)/1000 : 0,
    noteCount: Array.isArray(db.notes) ? db.notes.length : 0,
    jumpTestCount: Array.isArray(db.jumpTests) ? db.jumpTests.length : 0,
    motionTestCount: Array.isArray(db.motionTests) ? db.motionTests.length : 0,
    jumpMeasCount: Array.isArray(db.jumpMeasurements) ? db.jumpMeasurements.length : 0,
    fvProfileCount: Array.isArray(db.fvProfiles) ? db.fvProfiles.length : 0,
    jumpTestSum: Array.isArray(db.jumpTests) ? Math.round(db.jumpTests.reduce((a,j)=>a+(Number(j.standing)||0)+(Number(j.approach)||0),0)*1000)/1000 : 0,
    firstDate: dates[0]||null,
    lastDate: dates[dates.length-1]||null
  };
}

function migrateDB(rawDB){
  const report = {ok:false, from:null, to:null, steps:[], error:null};
  if(!rawDB || typeof rawDB!=='object'){ report.error='資料不是有效物件'; return report; }

  const startVersion = Number.isInteger(rawDB.schemaVersion) ? rawDB.schemaVersion : 0;
  report.from = startVersion;

  if(startVersion > CURRENT_SCHEMA){
    report.error = '資料版本 v'+startVersion+' 高於此版 App 支援的 v'+CURRENT_SCHEMA+
                   '。請改用較新版本的 App 開啟，避免資料損毀。';
    return report;
  }
  if(startVersion === CURRENT_SCHEMA){ report.ok=true; report.to=startVersion; return report; }

  const before = dbFingerprint(rawDB);
  let working;
  try{ working = JSON.parse(JSON.stringify(rawDB)); }
  catch(e){ report.error='資料無法複製（可能含循環參照）'; return report; }

  try{
    let v = startVersion;
    while(v < CURRENT_SCHEMA){
      const m = MIGRATIONS.find(x=>x.from===v);
      if(!m) throw new Error('找不到 v'+v+' → v'+(v+1)+' 的 migration，升級鏈斷裂');
      if(m.guard(working)){ m.up(working); report.steps.push({name:m.name, applied:true}); }
      else { working.schemaVersion = m.to; report.steps.push({name:m.name, applied:false}); }
      if(!m.mutatesValues){
        if(!fingerprintEqual(before, dbFingerprint(working)))
          throw new Error('migration「'+m.name+'」改動了使用者資料（指紋不符），已中止');
      }
      if(working.schemaVersion !== m.to) throw new Error('migration「'+m.name+'」未正確設定 schemaVersion');
      v = m.to;
    }
    working.meta = working.meta || {};
    working.meta.migrations = working.meta.migrations || [];
    working.meta.migrations.push({
      from:startVersion, to:CURRENT_SCHEMA, at:new Date().toISOString(),
      steps:report.steps.map(s=>s.name), verified:true
    });
    report.ok=true; report.to=CURRENT_SCHEMA; report.db=working;
    return report;
  }catch(e){
    report.error = e.message;   // working 丟棄，rawDB 完全沒被碰過
    return report;
  }
}

async function snapshotBeforeMigration(rawString, fromVersion){
  const key = BAK_PREFIX + fromVersion + '-' + Date.now();
  try{
    await window.storage.set(key, rawString);
    if(typeof window.storage.list==='function' && typeof window.storage.delete==='function'){
      const r = await window.storage.list(BAK_PREFIX);
      const keys = ((r && r.keys)||[]).filter(k=>k.indexOf(BAK_PREFIX)===0).sort();
      while(keys.length>3){ await window.storage.delete(keys.shift()); }
    }
    return key;
  }catch(e){ return null; }
}
async function listBackups(){
  try{
    if(typeof window.storage.list!=='function') return [];
    const r = await window.storage.list(BAK_PREFIX);
    return ((r && r.keys)||[]).filter(k=>k.indexOf(BAK_PREFIX)===0).sort().reverse();
  }catch(e){ return []; }
}

async function loadDB(){
  let raw = null;
  try{ const r = await window.storage.get('kenny-db'); if(r && r.value) raw = r.value; }catch(e){}

  if(raw===null){                       // 全新安裝：儲存空間是空的
    if(SEED_DATA){                      // 有種子 → 帶入舊資料（只會發生這一次）
      const seed = JSON.parse(JSON.stringify(SEED_DATA));
      const rep = migrateDB(seed);
      if(rep.ok){
        DB = rep.db || seed;
        DB.meta = DB.meta || {};
        DB.meta.seededAt = new Date().toISOString();
        await saveDB();
      }
    } else {
      DB.schemaVersion = CURRENT_SCHEMA;
    }
    applyTheme(); applyMode();
    return true;
  }

  let parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){ return fatalScreen('儲存的資料不是有效的 JSON，無法解析。', raw); }

  const startV = Number.isInteger(parsed.schemaVersion) ? parsed.schemaVersion : 0;
  if(startV < CURRENT_SCHEMA) await snapshotBeforeMigration(raw, startV);   // 升級前先留快照

  const rep = migrateDB(parsed);
  if(!rep.ok) return fatalScreen(rep.error, raw);

  DB = rep.db || parsed;
  if(rep.steps.some(s=>s.applied)) await saveDB();   // 升級成功才落地
  applyTheme(); applyMode();
  return true;
}
async function saveDB(){
  if(FATAL) return;                     // 載入失敗時一律不寫入，避免覆蓋原始資料
  try{ await window.storage.set('kenny-db', JSON.stringify(DB)); }catch(e){}
}
function applyTheme(){ document.body.setAttribute('data-theme', DB.settings.theme||'light'); }
function applyMode(){ PROGRAM = DB.settings.mode==='home' ? PROGRAM_HOME : PROGRAM_GYM; }

function progFor(mode){ return mode==='home' ? PROGRAM_HOME : PROGRAM_GYM; }
function safeDay(mode,day){ const p=progFor(mode); return p[day] || PROGRAM_GYM[day]; }
function fmtDate(d){
  // A1修正：不能用 new Date("YYYY-MM-DD")，那是 UTC 零點，時區非UTC+0時顯示會差一天。
  // 一律拆本地年月日字串本身，跟 localISO 對稱，不經過 Date 物件的時區轉換。
  if(typeof d !== 'string') return '';
  const parts = d.split('-');
  if(parts.length<3) return d;
  const m = Number(parts[1]), day = Number(parts[2]);
  return m+"/"+day;
}
function escapeHtml(str){
  if(str===null || str===undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function localISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return localISO(new Date()); }
function weekdayStr(){ return ["週日","週一","週二","週三","週四","週五","週六"][new Date().getDay()]; }

function nextSuggestedDay(){
  const mainDays = DB.sessions.filter(s=>s.day>=1 && s.day<=4);
  if(mainDays.length===0) return 1;
  const last = mainDays[mainDays.length-1].day;
  return last>=4 ? 1 : last+1;
}

// 取某動作最近 N 次已完成訓練的紀錄，由近到遠排序。用來判斷「連續沒進步」，
// 不是只看單次——PDF「卡關了怎麼辦」原文就是「某動作連續 2–3 次沒進步時」才觸發檢查，
// 單次退步是正常疲勞波動，不該被當成卡關。
function recentPerformances(exName, n){
  const out = [];
  for(let i=DB.sessions.length-1; i>=0 && out.length<n; i--){
    const s = DB.sessions[i];
    if(s.deload) continue; // Deload 週是照課表規則主動減量，不能拿來判斷「有沒有進步」
    const ex = s.exercises.find(e=>e.def.n===exName);
    if(ex && ex.sets.some(st=>st.done)) out.push({date:s.date, sets:ex.sets.filter(st=>st.done)});
  }
  return out;
}

// 連續卡關判斷：最近兩次紀錄的重量相同，而且兩次都沒有做到次數上限。
// 只看「同一個重量」是刻意的——如果中間有降重量再重新推，那是正常的自我調節，不算卡關。
// PHASE 2／PHASE 1：reps 欄位有三種格式混用——單一數字("5")、範圍("10–12")、單邊註記("12/邊")。
// parseInt() 對範圍字串只會抓到下限（parseInt("10–12")===10），這是個真的 bug：居家模式
// 判斷「這個變化式練到頂了、該換下一個難度」時，會拿下限10當作「頂」，導致使用者做到
// 10下（範圍下限）就被誤判成已經練滿，其實課表要的是做滿範圍上限12下才該換。
// 這裡明確拆出 repMin/repMax，「練到頂了沒」永遠用 repMax 判斷，不是 parseInt 抓到什麼算什麼。
function parseRepTarget(repsStr){
  const s = String(repsStr).replace(/\/邊/g,'').trim();
  const m = s.match(/(\d+)\s*[–—-]\s*(\d+)/); // 支援 en dash(–)／em dash(—)／一般連字號(-)
  if(m) return {min:Number(m[1]), max:Number(m[2])};
  const single = parseInt(s);
  return isNaN(single) ? {min:null, max:null} : {min:single, max:single};
}

function detectPlateau(exDef){
  const recents = recentPerformances(exDef.n, 2);
  if(recents.length < 2) return null;
  const repTarget = parseRepTarget(exDef.reps);
  const targetReps = repTarget.max;
  const weightOf = r => Math.max(...r.sets.map(s=>s.weight||0));
  const w0 = weightOf(recents[0]);
  const sameWeight = recents.every(r => weightOf(r)===w0);
  const bothMissed = recents.every(r => !(r.sets.length>=exDef.sets && r.sets.every(s=>s.reps>=targetReps)));
  return (sameWeight && bothMissed) ? {weight:w0} : null;
}

// PHASE 4：分類過的平台期診斷，不是單一boolean，也不自動觸發deload——只回傳型態＋證據清單＋
// 資料品質說明，給人自己判斷。可能的型態：
//   WEIGHT_PLATEAU — 重量沒變、次數也沒進步，真的卡住了
//   REP_PLATEAU — 重量沒變，但次數其實在慢慢往上爬，只是還沒到範圍上限，不是真的卡關
//   PROGRESSING — 沒有連續卡住的訊號
//   INSUFFICIENT_DATA — 資料不夠判斷
//   TECHNICAL_PROGRESS — 這個型態存在於分類定義裡，但這個App沒有動作品質/影片資料，
//     沒辦法從現有資料判斷技術是否進步，永遠不會被這個函式輸出，只能靠STUCK_CHECKLIST
//     裡「拍影片跟以前比」這條讓使用者自己判斷。列在這裡是為了誠實說明「這類不做」，
//     不是假裝App能自動判斷技術進步。
function diagnosePlateauType(exDef){
  const recents = recentPerformances(exDef.n, 3);
  if(recents.length < 2) return {type:'INSUFFICIENT_DATA', evidence:[], dataQuality:'少於2次可比較的紀錄'};

  const repTarget = parseRepTarget(exDef.reps);
  const targetReps = repTarget.max;
  const weightOf = r => Math.max(...r.sets.map(s=>s.weight||0));
  const repsOf = r => Math.max(...r.sets.map(s=>s.reps||0));

  const last2 = recents.slice(0,2); // recents[0]是最新，[1]是次新
  const w0 = weightOf(last2[0]);
  const sameWeight = last2.every(r=>weightOf(r)===w0);
  const bothMissedTop = last2.every(r => !(r.sets.length>=exDef.sets && r.sets.every(s=>s.reps>=targetReps)));

  if(!(sameWeight && bothMissedTop)){
    return {type:'PROGRESSING', evidence:['最近沒有連續卡住的訊號'], dataQuality:last2.length+'次紀錄可查'};
  }

  const evidence = ['連續2次重量沒變（'+w0+'kg）', '連續2次沒做到次數上限（目標'+targetReps+'下）'];

  if(recents.length>=3){
    const oldest = recents[recents.length-1], newest = recents[0];
    if(repsOf(newest) > repsOf(oldest)){
      evidence.push('次數其實在慢慢進步（'+repsOf(oldest)+'→'+repsOf(newest)+'下），只是還沒到範圍上限');
      return {type:'REP_PLATEAU', evidence, weight:w0, dataQuality:recents.length+'次紀錄可查',
        note:'次數在進步，不是真的卡關，繼續同重量練，不用照卡關檢查清單處理'};
    }
  }
  return {type:'WEIGHT_PLATEAU', evidence, weight:w0, dataQuality:last2.length+'次紀錄可查',
    note:'照PDF的卡關檢查順序排查，不是單純沒睡飽的雜訊'};
}


function lastPerformance(exName, excludeSessionId){
  for(let i=DB.sessions.length-1;i>=0;i--){
    const s = DB.sessions[i];
    if(excludeSessionId && s.id===excludeSessionId) continue;
    const ex = s.exercises.find(e=>e.def.n===exName);
    if(ex && ex.sets.some(st=>st.done)) return {date:s.date, sets:ex.sets.filter(st=>st.done)};
  }
  return null;
}

// PDF「THE ONLY RULE」原文：四組都做到次數上限，「而且做完還剩下該有的 RIR」→ 下次加重量。
// 這是兩個條件的 AND，不是只看次數。下面把 RIR 這一半的判斷補齊，並依組間 RIR 的分布
// 給出不同把握程度的建議——但增重的公斤數永遠只用 PDF 表訂的 inc，不自創新的加重邏輯。
function suggestNextLoad(exDef){
  const last = lastPerformance(exDef.n);
  if(!last || !exDef.main) return null;
  const repTarget = parseRepTarget(exDef.reps);
  const targetReps = repTarget.max; // 練到頂了沒，永遠看範圍上限，不是parseInt抓到的下限
  const targetRir = parseInt(exDef.rir);          // "1–2" 取下限 1：實際 RIR 至少要有這麼多才算「符合規定」
  const hasRirTarget = !isNaN(targetRir);
  const doneSets = last.sets;
  const allHitTop = doneSets.length>=exDef.sets && doneSets.every(s=>s.reps>=targetReps);

  if(exDef.home){
    if(allHitTop) return {suggest:true, mode:'home', reason:"上次全數達標次數上限（"+targetReps+"下）→ 該換下一個難度技巧了", note:exDef.diffNote, confidenceTier:'HIGH'};
    return {suggest:false, confidenceTier:'LOW'};
  }
  if(!allHitTop){
    // Tier 3：連續兩次在同一個重量都沒做到次數上限 → 這不再是「這次沒達標」的雜訊，
    // 是 PDF「卡關了怎麼辦」定義的訊號。串連既有的九步驟檢查清單，不發明新的判斷標準。
    const plateau = detectPlateau(exDef);
    if(plateau){
      // PHASE 4：用分類過的診斷結果豐富文字說明，但不改變原本 .plateau:true/false 的外部
      // 合約——REP_PLATEAU（次數其實在進步，只是還沒到範圍上限）不該用跟WEIGHT_PLATEAU
      // 一樣的「照卡關清單排查」語氣去嚇使用者，這是兩種不同情況。
      const diag = diagnosePlateauType(exDef);
      const reason = diag.type==='REP_PLATEAU'
        ? "重量沒變，但次數其實在慢慢進步（還沒到範圍上限）→ 這不是真的卡關，繼續同重量練就好"
        : "這個重量已經連續 2 次沒做到次數上限 → 照 PDF 的卡關檢查順序排查，不是單純沒睡飽的雜訊";
      return {suggest:false, plateau:true, weight:plateau.weight, plateauType:diag.type,
        reason, confidenceTier:'MEDIUM'};
    }
    return {suggest:false, confidenceTier:'LOW'};
  }

  const w = Math.max(...doneSets.map(s=>s.weight||0));
  // PHASE 2：micro-loading——如果這個動作有 microInc（比表定 inc 更小的最小可加重量，
  // 例如啞鈴只能一次跳2.5kg但槓片可以跳1.25kg），優先用 microInc；沒設定就用表定 inc，
  // 行為完全不變。器材限制目前唯一已知的表現方式是「換成替代動作」（GYM_SUBSTITUTE），
  // 不是重量增量的問題，所以這裡不重複處理器材限制，那已經在別的路徑做了。
  const increment = (exDef.microInc!==undefined && exDef.microInc!==null) ? exDef.microInc : exDef.inc;
  const rirVals = doneSets.filter(s=>s.rir!==null && s.rir!==undefined && s.rir!=='').map(s=>Number(s.rir)).filter(v=>!isNaN(v));
  const rirComplete = hasRirTarget && rirVals.length===doneSets.length;

  if(rirComplete){
    const minRir = Math.min(...rirVals);
    if(minRir < targetRir){
      // 次數雖然達標，但至少有一組的 RIR 低於規定——代表這組是硬做出來的，不是「還有餘裕」達標。
      // PDF 的規則要求兩個條件同時成立，這裡沒有同時成立，所以不建議加重。
      // PHASE 2保護規則：絕不因此調降 targetRir 這個標準本身去讓它看起來「達標」，
      // 只會維持重量或走保護性判斷，標準永遠不變。
      return {suggest:false, mode:'gym', reason:"次數達標，但有一組 RIR 低於規定（做得比預期喘）→ 建議維持這次重量，下次再挑戰加重",
              hold:true, minRir, targetRir, confidenceTier:'MEDIUM'};
    }
    if(minRir >= targetRir + 2){
      // 每一組都比規定的 RIR 寬鬆很多——加重的把握比一般情況更足，但公斤數還是用課表設定的增量，不加碼。
      return {suggest:true, mode:'gym', newWeight:(w+increment), confidence:'high', confidenceTier:'HIGH',
              reason:"上次每組 RIR 都比規定寬鬆（"+minRir+" ≥ "+targetRir+"+2）→ 加重的把握很足"};
    }
    return {suggest:true, mode:'gym', newWeight:(w+increment), confidence:'normal', confidenceTier:'HIGH',
            reason:"上次全數達標次數上限、RIR 也符合規定 → 建議加重"};
  }

  // 這次紀錄沒有留 RIR 資料（例如舊資料或使用者沒填），退回只看次數的原始規則，但誠實標示信心較低——
  // 三級規則下，這屬於 MEDIUM（不是 LOW／No Data，畢竟重量次數資料本身是完整的，只是少了RIR這一半
  // 驗證條件），所以還是給出建議重量，但明確要求使用者自行確認。
  return {suggest:true, mode:'gym', newWeight:(w+increment), confidence:'low', confidenceTier:'MEDIUM',
          reason:"上次全數達標次數上限（這幾組沒有 RIR 紀錄，無法確認是否符合規定）→ 建議加重，需要你自行確認要不要挑戰"};
}

      </div>` : `

      <p class="muted" style="font-size:12px; margin-top:4px">PDF說這是整份計畫成不成功的關鍵指標，先測一次原地跳跟助跑跳</p>`}

      <div style="height:9px"></div>
      <button class="btn btn-sm" data-action="logJumpTest" style="width:100%">記錄這次測試</button>
    </div>`;
}

function renderHome(){
  const sug = nextSuggestedDay();
  const last = DB.sessions.length ? DB.sessions[DB.sessions.length-1] : null;
  const isHome = DB.settings.mode==='home';
  const now = new Date();
  // 本週（週一起算）的必練完成度 —— Rise Meter 的來源
  const dow = (now.getDay()+6)%7;
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(now); d.setDate(now.getDate()-dow+i);
    const iso = localISO(d);
    days.push({iso, has: DB.sessions.some(s=>s.date===iso), today: iso===todayISO()});
  }
  const weekMain = DB.sessions.filter(s=>s.date>=days[0].iso && s.day>=1 && s.day<=4).length;
  const pct = Math.min(100, weekMain/4*100);
  const totalVol = DB.sessions.reduce((a,s)=>a+s.exercises.reduce((b,e)=>
    b + (e.def.weighted ? e.sets.filter(x=>x.done).reduce((c,x)=>c+(x.weight||0)*(x.reps||0),0) : 0),0),0);

  return `
    <section class="hero">
      <div class="hero-grid">
        <div class="meter">
          <div class="meter-tick" style="bottom:25%"></div>
          <div class="meter-tick" style="bottom:50%"></div>
          <div class="meter-tick" style="bottom:75%"></div>
          <div class="meter-fill" style="height:${pct}%"></div>
        </div>
        <div>
          <div class="label">${todayISO().replace(/-/g,'.')} · ${weekdayStr()} · ${isHome?'居家':'健身房'}</div>
          <h1 class="hero-day">${PROGRAM[sug].name.replace(' — ','<br>')}</h1>
          <div class="hero-sub">
            <span class="hero-stat"><b>${PROGRAM[sug].exercises.length}</b><span class="label">動作</span></span>
            <span class="hero-stat"><b>${PROGRAM[sug].exercises.reduce((a,e)=>a+e.sets,0)}</b><span class="label">組</span></span>
            <span class="hero-stat"><b>${weekMain}<span style="color:var(--faint)">/4</span></b><span class="label">本週</span></span>
          </div>
        </div>
      </div>
      <div style="height:22px"></div>
      <button class="btn btn-primary" data-action="startDay" data-day="${sug}">開始這次訓練</button>
      <div style="height:9px"></div>
      <button class="btn btn-sm" data-action="goWorkout" style="width:100%">換一個 Day，或補登過去的訓練</button>
    </section>

    ${safetyWarningsCard()}
    ${homeJumpTestSection()}

    <h3>這週</h3>
    <div class="tl" style="padding-left:0; margin-top:0">
      ${days.map(d=>{
        const daySessions = DB.sessions.filter(s=>s.date===d.iso);
        const weekdayLabel = ['一','二','三','四','五','六','日'][days.indexOf(d)];
        if(!daySessions.length){
          return `<div class="tl-item" style="border-bottom:1px solid var(--line2); opacity:${d.today?1:.55}">
            <div class="tl-date" style="${d.today?'color:var(--mark)':''}">週${weekdayLabel}</div>
            <div class="tl-body"><div class="tl-meta">${d.today?'今天還沒練':'沒有訓練'}</div></div>
          </div>`;
        }
        return daySessions.map(s=>`
          <div class="tl-item" data-action="viewSession" data-id="${s.id}" style="border-bottom:1px solid var(--line2)">
            <div class="tl-date" style="${d.today?'color:var(--mark)':''}">週${weekdayLabel}</div>
            <div class="tl-body">
              <div class="tl-name">${progFor(s.mode)[s.day].name}${s.backfill?' <span class="tag tag-mid" style="font-size:9.5px; vertical-align:middle">補登</span>':''}</div>
              <div class="tl-meta">${s.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0)} SETS · ${s.mode==='home'?'HOME':'GYM'}</div>
            </div>
            <span style="color:var(--faint)">›</span>
          </div>`).join('');
      }).join('')}
    </div>
    <p class="muted" style="font-size:11px; margin-top:8px">補登的訓練也算進這週，標「補登」的是事後回填的日期，不是當天記錄的</p>

    <h3>累計</h3>
    <div class="flow">
      <div class="chip"><span class="label">訓練次數</span><b>${DB.sessions.length}</b></div>
      <div class="chip"><span class="label">總訓練量</span><b>${totalVol>=1000?(totalVol/1000).toFixed(1)+'t':Math.round(totalVol)}</b></div>
      <div class="chip"><span class="label">完成組數</span><b>${DB.sessions.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+e.sets.filter(x=>x.done).length,0),0)}</b></div>
      ${DB.bodyweight.length?`<div class="chip"><span class="label">體重</span><b>${DB.bodyweight[DB.bodyweight.length-1].weight}</b></div>`:''}
    </div>

    ${last ? `
    <h3>上一次</h3>
    <div class="tl" style="padding-left:0; margin-top:0">
      <div class="tl-item" data-action="viewSession" data-id="${last.id}" style="border-bottom:none">
        <div class="tl-date">${fmtDate(last.date)}</div>
        <div class="tl-body">
          <div class="tl-name">${progFor(last.mode)[last.day].name}</div>
          <div class="tl-meta">${last.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0)} SETS · ${last.mode==='home'?'HOME':'GYM'}</div>
        </div>
        <span style="color:var(--faint)">›</span>
      </div>
    </div>` : `
    <div class="empty">
      <div class="figure">0</div>
      <p class="muted" style="margin-top:10px">還沒有任何紀錄。第一次訓練會成為之後所有進度的基準線。</p>
    </div>`}
  `;
}

function renderToday(){
  const day = state.currentDay;
  const sess = state.currentSession;
  const totalSets = sess.exercises.reduce((a,e)=>a+e.sets.length,0);
  const doneSets = sess.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
  const firstIncomplete = sess.exercises.findIndex(ex=>ex.sets.some(s=>!s.done));
  const pct = totalSets ? doneSets/totalSets*100 : 0;
  return `
    <div class="topbar"><div class="back" data-action="backHome">‹</div>
      <div style="flex:1; min-width:0"><div class="label">${sess.backfill?'補登中':'進行中'}</div>
      <h1 style="font-size:22px; overflow-wrap:break-word">${PROGRAM[day].name}</h1></div></div>

    ${sess.backfill ? `
    <div class="note">
      <div class="label label-mark">補登模式</div>
      <div style="display:flex; align-items:center; gap:10px; margin-top:8px">
        <span class="muted" style="font-size:13px">訓練日期</span>
        <input type="date" id="backfillDate" value="${sess.date}" style="width:auto; flex:0 0 auto; padding:8px 10px">
      </div>
    </div>` : ''}

    ${(!sess.backfill && (sess.mode==='home'?WARMUP_HOME:WARMUP_GYM)[day]) ? `
    <div class="note" style="margin-top:14px">
      <div class="label">熱身</div>
      <p style="font-size:13.5px; line-height:1.6; margin:6px 0 0">${(sess.mode==='home'?WARMUP_HOME:WARMUP_GYM)[day]}</p>
    </div>` : ''}

    <div class="util-row" style="border-bottom:none; padding-top:14px">
      <span>這次是 Deload 減量週</span>
      <div class="toggle ${sess.deload?'on':''}" data-action="toggleDeload"></div>
    </div>
    ${sess.deload ? `<p class="muted" style="font-size:12px; margin:-4px 0 0">組數／重量本來就會比平常低，不會被算進「連續卡關」判斷</p>` : ''}

    <div style="display:flex; align-items:baseline; gap:8px; margin:18px 0 2px">
      <span class="figure f-big">${doneSets}</span>
      <span class="figure" style="font-size:20px; color:var(--faint)">/ ${totalSets}</span>
      <span class="label" style="margin-left:auto">已完成組數</span>
    </div>

    <div class="ladder">
      <div class="ladder-fill" style="height:calc(${pct}% - 12px)"></div>
      ${sess.exercises.map((ex,i)=>{
        const def = ex.def;
        const done = ex.sets.filter(s=>s.done).length;
        const allDone = done===ex.sets.length;
        const isCurrent = i===firstIncomplete;
        return `
        <div class="rung ${allDone?'done':''} ${isCurrent?'now':''}" data-action="openExercise" data-idx="${i}">
          <div class="node">${allDone?'✓':''}</div>
          <div style="flex:1; min-width:0">
            <div class="rung-name">${dn(def.n)}${(!def.home && GYM_SUBSTITUTE[def.n] && findSubstituteDef(GYM_SUBSTITUTE[def.n].sub))?' <span class="tag tag-mid" style="font-size:10px; vertical-align:middle">可替代</span>':''}</div>
            <div class="rung-meta">${def.sets}×${def.reps} · RIR ${def.rir}${enSub(def.n)?' · '+enSub(def.n):''}</div>
          </div>
          <div class="rung-count">${done}<span style="color:var(--faint)">/${def.sets}</span></div>
        </div>`;
      }).join('')}
    </div>
    <div style="height:22px"></div>
    <button class="btn btn-primary" data-action="finishWorkout">完成訓練</button>
  `;
}

function smartDefault(ex, si, field){
  // carry forward from an earlier completed set in THIS session first
  for(let j=si-1;j>=0;j--){ if(ex.sets[j].done && ex.sets[j][field]!==null) return ex.sets[j][field]; }
  return null;
}

function renderExercise(){
  const sess = state.currentSession;
  const ex = sess.exercises[state.exIndex];
  const def = ex.def;
  const last = lastPerformance(def.n, sess.id);
  const suggestion = suggestNextLoad(def);
  const firstUndone = ex.sets.findIndex(s=>!s.done);
  const unit = def.type==='time' ? '秒' : '下';
  const doneCount = ex.sets.filter(s=>s.done).length;

  return `
    <div class="topbar"><div class="back" data-action="backToday">‹</div>
      <div style="flex:1; min-width:0">
        <div class="label">動作 ${state.exIndex+1} / ${sess.exercises.length}</div>
        <h1 style="font-size:23px; overflow-wrap:break-word">${dn(def.n)}</h1>
      </div>
      <div class="figure f-mid" style="color:${doneCount?'var(--mark)':'var(--faint)'}">${doneCount}<span style="font-size:15px; color:var(--faint)">/${def.sets}</span></div>
    </div>
    ${enSub(def.n)?`<div class="en" style="margin:-8px 0 0 48px">${enSub(def.n)}</div>`:''}

    <div style="display:flex; gap:20px; margin:20px 0 4px">
      <div><div class="label">目標</div><div class="figure f-mid">${def.reps}<span style="font-size:13px; color:var(--faint)"> ${unit}</span></div></div>
      <div><div class="label">RIR</div><div class="figure f-mid">${def.rir}</div></div>
      <div><div class="label">休息</div><div class="figure f-mid">${def.rest>=60?(def.rest/60):def.rest}<span style="font-size:13px; color:var(--faint)"> ${def.rest>=60?'分':'秒'}</span></div></div>
    </div>
    ${def.cue ? `<p class="muted" style="font-size:13.5px; line-height:1.6; margin-top:10px">${escapeHtml(def.cue)}</p>` : ''}
    <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(def.n+' exercise form tutorial')}" target="_blank" rel="noopener"
       style="display:inline-flex; align-items:center; gap:5px; margin-top:10px; font-size:12.5px; color:var(--mark); text-decoration:none; font-weight:700">
       ▶ 看動作示範影片
    </a>

    ${(!def.home && GYM_SUBSTITUTE[def.n] && doneCount===0 && findSubstituteDef(GYM_SUBSTITUTE[def.n].sub)) ? `
    <div class="note" style="border-left-color:var(--faint)">
      <div class="label">器材沒有或維修中？</div>
      <div style="margin-top:5px; font-size:14px">可以換成 <b>${dn(GYM_SUBSTITUTE[def.n].sub)}</b>（${GYM_SUBSTITUTE[def.n].note}），照 PDF 的健身房→居家對照表，訓練效果對應</div>
      <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(GYM_SUBSTITUTE[def.n].sub+' exercise form tutorial')}" target="_blank" rel="noopener"
         style="display:inline-flex; align-items:center; gap:5px; margin-top:8px; font-size:12px; color:var(--mark); text-decoration:none; font-weight:700">
         ▶ 先看看這個替代動作怎麼做
      </a>
      <button class="btn btn-sm" data-action="swapExercise" style="margin-top:10px; width:100%">換成這個動作</button>
    </div>` : ''}

    ${suggestion && suggestion.suggest ? `
    <div class="note">
      <div class="label label-mark">建議${suggestion.confidence==='high'?'（把握足）':suggestion.confidence==='low'?'（僅供參考）':''}</div>
      <div style="margin-top:5px; font-size:14.5px; font-weight:700">${suggestion.mode==='home'?suggestion.reason:(suggestion.reason+' → '+suggestion.newWeight+' kg')}</div>
      ${suggestion.mode==='home'?`<div class="muted" style="font-size:12.5px; margin-top:4px">${suggestion.note}</div>`:''}
    </div>` : suggestion && suggestion.plateau ? `
    <div class="note" style="border-left-color:var(--danger)">
      <div class="label" style="color:var(--danger)">連續卡關</div>
      <div style="margin-top:5px; font-size:14.5px; font-weight:700">${suggestion.reason}</div>
      <button class="btn btn-sm" data-action="openReference" style="margin-top:10px; width:100%">看卡關檢查清單</button>
    </div>` : suggestion && suggestion.hold ? `
    <div class="note" style="border-left-color:var(--faint)">
      <div class="label">維持這次重量</div>
      <div style="margin-top:5px; font-size:14.5px; font-weight:700">${suggestion.reason}</div>
    </div>` : ''}

    ${last ? `
    <h3>上次 · ${fmtDate(last.date)}</h3>
    <div style="display:flex; gap:7px; flex-wrap:wrap">
      ${last.sets.map(s=>`<span class="tag tag-mid" style="font-size:10.5px; padding:6px 9px; font-family:var(--rounded); font-weight:700; letter-spacing:0; text-transform:none">${def.weighted?s.weight+'kg × ':''}${s.reps}${unit}</span>`).join('')}
    </div>` : (()=>{
      // C2：沒歷史時，如果課表參考表有這個動作的起始重量，提示一下，不是完全空白；
      // 只當參考顯示，不自動填進輸入框——避免解析字串重量時猜錯，直接改欄位風險更高。
      const prog = progressionFor(def.n);
      return `<h3>上次</h3>` + (prog
        ? `<p class="muted" style="font-size:13px">沒有紀錄，這次會成為基準。課表建議起始重量：<b style="color:var(--text)">${prog.start}</b>（之後每次 ${prog.inc}）</p>`
        : `<p class="muted" style="font-size:13px">沒有紀錄，這次會成為基準。</p>`);
    })()}

    <h3>這次</h3>
    <div class="setstack">
      ${ex.sets.map((s,si)=>{
        const isActive = si===firstUndone;
        if(s.done){
          return `
          <div class="slab done ${state.justSet===si?'just':''}" data-action="toggleSet" data-si="${si}">
            <span class="idx">SET ${si+1}</span>
            <span class="done-val">${def.weighted?s.weight+' kg × ':''}${s.reps}${unit}${def.type!=='time'&&s.rir!==null&&s.rir!==''?` <span class="muted" style="font-family:var(--sans); font-weight:400; font-size:12px">RIR ${s.rir}</span>`:''}</span>
            <span style="color:var(--mark); font-size:15px">✓</span>
          </div>`;
        }
        const wDefault = s.weight!==null ? s.weight : (smartDefault(ex,si,'weight') ?? (last && last.sets[si] ? last.sets[si].weight : (last && last.sets[0] ? last.sets[0].weight : '')));
        const rDefault = s.reps!==null ? s.reps : (smartDefault(ex,si,'reps') ?? (last && last.sets[si] ? last.sets[si].reps : (last && last.sets[0] ? last.sets[0].reps : '')));
        // C2：RIR 也要跟重量／次數一樣預填上次同一組的數字，不是每次都空白重打。
        const lastRirRaw = last && last.sets[si] && last.sets[si].rir!==null && last.sets[si].rir!==undefined && last.sets[si].rir!=='' ? last.sets[si].rir
          : (last && last.sets[0] && last.sets[0].rir!==null && last.sets[0].rir!==undefined && last.sets[0].rir!=='' ? last.sets[0].rir : '');
        const rirDefault = (s.rir!==null && s.rir!==undefined && s.rir!=='') ? s.rir : lastRirRaw;
        const cls = def.type==='time' ? 'fields time' : (def.weighted ? 'fields' : 'fields nw');
        return `
        <div class="slab ${isActive?'now':''}">
          <div class="slab-head">
            <span class="idx">SET ${si+1}</span>
            ${isActive?`<span class="tag tag-mark">現在這組</span>`:''}
          </div>
          <div class="${cls}">
            ${def.weighted ? `
            <div class="field"><span class="label">重量 KG</span>
              <div class="stepper">
                <button class="stepbtn" data-action="step" data-si="${si}" data-field="weight" data-delta="-2.5" type="button">−</button>
                <input type="number" inputmode="decimal" value="${wDefault}" data-setfield="weight" data-si="${si}" placeholder="0">
                <button class="stepbtn" data-action="step" data-si="${si}" data-field="weight" data-delta="2.5" type="button">+</button>
              </div>
            </div>` : ''}
            <div class="field"><span class="label">${def.type==='time'?'秒數':'次數'}</span>
              <div class="stepper">
                <button class="stepbtn" data-action="step" data-si="${si}" data-field="reps" data-delta="-1" type="button">−</button>
                <input type="number" inputmode="numeric" value="${rDefault}" data-setfield="reps" data-si="${si}" placeholder="0">
                <button class="stepbtn" data-action="step" data-si="${si}" data-field="reps" data-delta="1" type="button">+</button>
              </div>
            </div>
            ${def.type!=='time' ? `
            <div class="field"><span class="label">RIR</span>

            </div>` : ''}

          <div class="check" data-action="toggleSet" data-si="${si}">完成這組</div>
        </div>`;
      }).join('')}

// ============================================================
// Readiness 偏差標記——僅供參考，不驅動任何自動決策
// ============================================================
// 範圍聲明：這不是規格書原本要的「Adaptive Readiness Engine」。真的查證過28天Z-score
// 監控法的文獻後，每一篇都強調「顯著偏差應該觸發『對話』，不是『自動行動』」，而且同一批
// 文獻也指出主觀自陳量表的效度常常比客觀指標更好——這代表這個機制的正確用法本來就是
// 「標記給人看，人自己判斷」，不是拿來自動觸發訓練決策。所以這裡只做標記，不接進
// suggestNextLoad() 或任何訓練建議邏輯。
//
// 1.5個標準差這個門檻不是我發明的，是團隊運動監控文獻裡常見的慣例閾值（用來決定「這個
// 偏差值不值得注意」），拿來當一個合理的參考起點，不是針對 Kenny 個人資料驗證過的精確值。
const READINESS_FIELDS = {
  energy: {label:'精力', higherIsBetter:true},
  soreness: {label:'痠痛', higherIsBetter:false},
  sleepHours: {label:'睡眠', higherIsBetter:true}
};
const READINESS_SD_THRESHOLD = 1.5;
const READINESS_MIN_SAMPLES = 5; // 樣本太少，平均值跟SD本身就不穩，不夠格當基準

function computeReadinessBaseline(field, excludeSessionId){
  const [ty,tm,td] = todayISO().split('-').map(Number);
  const today = new Date(ty,tm-1,td);
  const vals = DB.sessions
    .filter(s=>s.id!==excludeSessionId && s.checkin && typeof s.checkin[field]==='number')
    .filter(s=>{
      const [sy,sm,sd] = s.date.split('-').map(Number);
      const days = (today - new Date(sy,sm-1,sd))/86400000;
      return days>=0 && days<=28;
    })
    .map(s=>s.checkin[field]);
  if(vals.length < READINESS_MIN_SAMPLES) return {ok:false, n:vals.length};
  const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(vals.length-1));
  return {ok:true, n:vals.length, mean:Math.round(mean*10)/10, sd:Math.round(sd*100)/100};
}

// 回傳每個欄位的標記結果，資料不足一律回傳 INSUFFICIENT_DATA，不用今天單一數字硬湊基準。
function readinessDeviationFlags(session){
  return Object.keys(READINESS_FIELDS).map(field=>{
    const meta = READINESS_FIELDS[field];
    const todayVal = session.checkin ? session.checkin[field] : null;
    if(todayVal===null || todayVal===undefined || todayVal===''){
      return {field, label:meta.label, status:'NO_INPUT'};
    }
    const baseline = computeReadinessBaseline(field, session.id);
    if(!baseline.ok){
      return {field, label:meta.label, status:'INSUFFICIENT_DATA', n:baseline.n, todayVal};
    }
    if(baseline.sd===0){
      return {field, label:meta.label, status:'NO_VARIANCE', mean:baseline.mean, todayVal};
    }
    const z = (todayVal - baseline.mean) / baseline.sd;
    const worseDirection = meta.higherIsBetter ? z<0 : z>0;
    const flagged = Math.abs(z) >= READINESS_SD_THRESHOLD && worseDirection;
    return {field, label:meta.label, status: flagged?'FLAGGED':'NORMAL', z:Math.round(z*100)/100,
      mean:baseline.mean, todayVal, n:baseline.n};
  });
}

// ============================================================
// Data Governance & Safety——純工程問題，不涉及生理假設
// ============================================================
// 明確區分 null（沒填）／undefined（欄位不存在）／NaN（打了非數字）／0（真的填了零，
// 這是合法值，不是「沒資料」——RIR=0代表做到力竭，體脂0%不合理但體重0kg也不該被當「沒填」
// 處理掉，要用範圍檢查抓，不是用「falsy就當沒填」這種寫法，那會把合法的0值誤判成缺值）。
function sanitizeNumber(raw, opts){
  opts = opts || {};
  const {min, max, allowZero=true} = opts;
  if(raw===null || raw===undefined || raw===''){
    return {value:null, valid:true, reason:null}; // 沒填是合法狀態，不是錯誤
  }
  const n = Number(raw);
  if(isNaN(n)) return {value:null, valid:false, reason:'不是數字'};
  if(n===0 && !allowZero) return {value:null, valid:false, reason:'這個欄位不接受0'};
  if(min!==undefined && n<min) return {value:null, valid:false, reason:'低於合理下限('+min+')'};
  if(max!==undefined && n>max) return {value:null, valid:false, reason:'高於合理上限('+max+')'};
  return {value:n, valid:true, reason:null};
}

// 引導式安全提醒——只描述觀察到的資料模式，不做醫療判斷、不用「你可能有OOO」這種語氣。
// 只在真的有連續多筆資料支持時才顯示，單一次事件不觸發（避免對雜訊反應過度）。
function generateSafetyWarnings(){
  const warnings = [];

  // 體重短時間內變化很大——只描述數字，建議去留意營養或恢復，不做因果診斷
  const bw = [...DB.bodyweight].sort((a,b)=>a.date<b.date?-1:1);
  if(bw.length>=2){
    const latest = bw[bw.length-1];
    const [ly,lm,ld] = latest.date.split('-').map(Number);
    const latestDate = new Date(ly,lm-1,ld);
    const recentPrior = [...bw].reverse().find(b=>{
      if(b.date===latest.date) return false;
      const [py,pm,pd] = b.date.split('-').map(Number);
      const days = (latestDate - new Date(py,pm-1,pd))/86400000;
      return days>=5 && days<=10;
    });
    if(recentPrior && recentPrior.weight>0){
      const pctChange = (latest.weight - recentPrior.weight)/recentPrior.weight*100;
      if(Math.abs(pctChange) >= 3){
        warnings.push({
          type:'bodyweight_change',
          confidenceTier:'MEDIUM', // 兩個數字比較，需要人自己判斷是不是真的問題，不是HIGH直接下結論
          evidence:[`${recentPrior.date} → ${latest.date}：${recentPrior.weight}kg → ${latest.weight}kg（${pctChange>0?'+':''}${Math.round(pctChange*10)/10}%）`],
          dataQuality:'僅2筆體重紀錄比較，樣本很小',
          message: `體重在約一週內變化了 ${pctChange>0?'+':''}${Math.round(pctChange*10)/10}%（${recentPrior.weight}→${latest.weight}kg）——這麼短時間的變化通常是水分或飲食波動，值得留意最近的睡眠與飲食，不用因為單一數字緊張`
        });
      }
    }
  }

  // 連續多次訓練RIR都貼近0——描述模式，建議留意恢復，不宣稱是過度訓練
  const recentSessions = DB.sessions.slice(-5);
  if(recentSessions.length>=5){
    const allRir = recentSessions.flatMap(s=>s.exercises.flatMap(e=>
      e.sets.filter(x=>x.done && x.rir!==null && x.rir!==undefined && x.rir!=='').map(x=>Number(x.rir))));
    if(allRir.length>=8){
      const avgRir = allRir.reduce((a,b)=>a+b,0)/allRir.length;
      if(avgRir <= 0.5){
        warnings.push({
          type:'sustained_low_rir',
          confidenceTier:'MEDIUM',
          evidence:[`最近5次訓練共${allRir.length}組有RIR紀錄，平均RIR ${Math.round(avgRir*10)/10}`],
          dataQuality:`5次訓練、${allRir.length}組樣本`,
          message: `最近5次訓練的組數普遍做到只剩0下保留——這樣的強度持續一段時間，值得留意睡眠和恢復是否跟得上，不代表一定有問題`
        });
      }
    }
  }
  return warnings;
}

function safetyWarningsCard(){
  const warnings = generateSafetyWarnings();
  if(!warnings.length) return '';
  return `<div class="note" style="margin:0 16px 14px">
    <div class="label">留意一下</div>
    ${warnings.map(w=>`<div style="margin-top:6px; font-size:13px; line-height:1.6">${w.message}</div>`).join('')}
  </div>`;
}

function readinessNote(session){
  const flags = readinessDeviationFlags(session);
  const withData = flags.filter(f=>f.status==='FLAGGED'||f.status==='NORMAL');
  if(!withData.length) return '';
  const flagged = flags.filter(f=>f.status==='FLAGGED');
  return `<div class="note" style="border-left-color:var(--faint); margin-top:10px">
    <div class="label">跟你自己過去28天比（僅供參考，不是建議）</div>
    ${flagged.length ? flagged.map(f=>`<div style="margin-top:5px; font-size:13px">${f.label}今天 ${f.todayVal}，比你近期平均（${f.mean}）明顯${READINESS_FIELDS[f.field].higherIsBetter?'低':'高'}，值得留意，不代表一定要做什麼</div>`).join('')
      : `<div style="margin-top:5px; font-size:13px; color:var(--faint)">今天的數字都在你自己近期的正常範圍內</div>`}
    <div class="muted" style="font-size:10.5px; margin-top:6px">基準來自你自己過去最多28天、至少${READINESS_MIN_SAMPLES}次紀錄，不是外部標準；這只是提示，不會拿去自動調整任何建議重量</div>

}

function renderComplete(){

  const avgRir = rirVals.length ? (rirVals.reduce((a,b)=>a+b,0)/rirVals.length).toFixed(1) : '—';
  const volume = sess.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done&&e.def.weighted).reduce((b,s)=>b+(s.weight||0)*(s.reps||0),0),0);
  const newPRs = [];
  sess.exercises.forEach(e=>{
    if(!e.def.weighted) return;
    const doneSets = e.sets.filter(s=>s.done && s.weight!==null);
    if(doneSets.length===0) return;
    const priorSets = DB.sessions.flatMap(s=>{
      const ex = s.exercises.find(x=>x.def.n===e.def.n);
      return ex ? ex.sets.filter(x=>x.done && x.weight!==null) : [];
    });
    if(priorSets.length===0) return;
    const priorMax = Math.max(...priorSets.map(x=>x.weight));
    const thisMax = Math.max(...doneSets.map(x=>x.weight));

      <div class="label">${progFor(sess.mode)[sess.day].name}</div>

            <div class="label">前次 ${p.prior} KG · +${Math.round((p.weight-p.prior)*10)/10}</div>
          </div>
        </div>`).join('')}
    </div>` : ''}

    <h3>這次的數字</h3>
    <div class="readout" style="flex-wrap:wrap; gap:26px 34px">
      <div><span class="label">動作</span><b>${sess.exercises.length}</b></div>
      <div><span class="label">訓練量 KG</span><b>${volume>0?Math.round(volume):'—'}</b></div>
      <div><span class="label">平均 RIR</span><b>${avgRir}</b></div>
    </div>

    <h3>今天感覺如何（選填，10 秒）</h3>
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:12px">
      <span class="muted" style="font-size:13px; width:56px; flex-shrink:0">精力</span>

        ${[1,2,3,4,5].map(n=>`<div class="check" data-action="setEnergy" data-val="${n}" style="height:38px; font-family:var(--rounded); font-weight:800; font-size:14px; ${sess.checkin&&sess.checkin.energy===n?'background:var(--mark); border-color:var(--mark); color:var(--void)':''}">${n}</div>`).join('')}
      </div>

function dateLabel(d){
  const today = todayISO();
  const yest = localISO(new Date(Date.now()-86400000));
  if(d===today) return '今天';
  if(d===yest) return '昨天';
  return fmtDate(d);
}

}
